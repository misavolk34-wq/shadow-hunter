<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hamster Kombat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Базовые настройки и запрет выделения при быстрых тапах */
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body {
            background-color: #09090b;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Имитация мобильного экрана на ПК и полный экран на телефонах */
        #app-frame {
            width: 100%;
            max-width: 440px;
            height: 100dvh;
            background: linear-gradient(180deg, #121214 0%, #1c1f24 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        @media (min-width: 480px) {
            #app-frame {
                height: 94dvh;
                max-height: 880px;
                border-radius: 36px;
                border: 2px solid #2b2f38;
            }
        }

        /* Свечение верхней панели биржи (фирменный желтый дуговой градиент Hamster Kombat) */
        .main-board-glow {
            background: #1c1f24;
            border-top: 2px solid #f3ba2f;
            border-top-left-radius: 36px;
            border-top-right-radius: 36px;
            box-shadow: 0 -12px 35px rgba(243, 186, 47, 0.25);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Внешнее и внутреннее кольцо кнопки Хомяка */
        .hamster-outer-ring {
            background: linear-gradient(180deg, #51555c 0%, #272a2f 100%);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.2);
            transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
        }

        .hamster-inner-circle {
            background: radial-gradient(circle at 50% 35%, #374b9c 0%, #1a234b 65%, #0f142e 100%);
            box-shadow: inset 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 30px rgba(55, 75, 156, 0.4);
        }

        /* Режим Turbo / Шифра */
        .cipher-mode .hamster-inner-circle {
            background: radial-gradient(circle at 50% 35%, #b91c1c 0%, #631010 65%, #2b0606 100%);
            box-shadow: inset 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 35px rgba(239, 68, 68, 0.5);
        }

        .turbo-active .hamster-outer-ring {
            box-shadow: 0 0 45px rgba(243, 186, 47, 0.85), inset 0 0 20px #f3ba2f;
        }

        /* Анимация вылетающих цифр при тапе */
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -95%) scale(1.15);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -220%) scale(0.95);
            }
        }

        .floating-plus {
            position: fixed;
            pointer-events: none;
            font-weight: 800;
            font-size: 28px;
            color: #ffffff;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8), 0 0 12px rgba(243, 186, 47, 0.8);
            animation: floatUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 9999;
        }

        /* Искры при нажатии */
        @keyframes sparkFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .tap-spark {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f3ba2f;
            box-shadow: 0 0 8px #f3ba2f;
            pointer-events: none;
            animation: sparkFly 0.55s ease-out forwards;
            z-index: 9998;
        }

        /* Скрытие скроллбара для аккуратного вида */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Прогресс бар лиги */
        .league-gradient {
            background: linear-gradient(90deg, #98ff98 0%, #c8a2c8 50%, #7b68ee 100%);
        }

        /* Анимация пульсации индикатора прибыли */
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.65; transform: scale(1.15); }
        }
        .live-dot {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        /* Плавное появление модальных окон */
        @keyframes slideUpModal {
            from { transform: translateY(100%); opacity: 0.5; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-sheet {
            animation: slideUpModal 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

<div id="app-frame">
    <!-- ВЕРХНЯЯ ПАНЕЛЬ ПРОФИЛЯ -->
    <header class="px-4 pt-3 pb-2 flex items-center justify-between z-10 shrink-0">
        <!-- Аватар и имя CEO -->
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-[#272a2f] border border-[#383c44] flex items-center justify-center shadow-inner">
                <svg class="w-6 h-6" viewBox="0 0 36 36" fill="none">
                    <circle cx="18" cy="18" r="14" fill="#d99b52"/>
                    <circle cx="13" cy="15" r="2" fill="#121214"/>
                    <circle cx="23" cy="15" r="2" fill="#121214"/>
                    <path d="M16 19.5C16 18.6716 16.8954 18 18 18C19.1046 18 20 18.6716 20 19.5C20 20.3284 18 21 18 21C18 21 16 20.3284 16 19.5Z" fill="#ff9eb5"/>
                    <path d="M11 26L18 23L25 26V31H11V26Z" fill="#1e2229"/>
                    <path d="M17 23.5L18 28L19 23.5" fill="#e11d48"/>
                </svg>
            </div>
            <div>
                <div class="text-xs font-bold text-white flex items-center gap-1">
                    <span>CEO Игрок</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#272a2f] text-[#f3ba2f]">PRO</span>
                </div>
                <div id="header-rank-sub" class="text-[11px] text-gray-400">Bronze CEO</div>
            </div>
        </div>

        <!-- Правый блок: Кнопка звука + Выбор биржи -->
        <div class="flex items-center gap-2">
            <button id="sound-toggle-btn" onclick="toggleSound()" class="w-9 h-9 rounded-xl bg-[#272a2f] border border-[#383c44] flex items-center justify-center text-gray-300 active:scale-95 transition" title="Звук">
                <svg id="sound-icon-on" class="w-4 h-4 text-[#f3ba2f]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                </svg>
                <svg id="sound-icon-off" class="w-4 h-4 text-gray-500 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                </svg>
            </button>

            <button onclick="openExchangeModal()" class="flex items-center gap-2 bg-[#272a2f] hover:bg-[#31353c] border border-[#383c44] px-3 py-1.5 rounded-xl active:scale-95 transition">
                <span id="current-exchange-icon" class="w-5 h-5 flex items-center justify-center"></span>
                <span id="current-exchange-name" class="text-xs font-bold text-white">Binance</span>
            </button>
        </div>
    </header>

    <!-- ЛИГА И ПАНЕЛЬ ПРИБЫЛИ В ЧАС -->
    <div class="px-4 pb-3 flex items-center justify-between gap-3 shrink-0">
        <!-- Прогресс лиги -->
        <div onclick="openLeaguesModal()" class="flex-1 cursor-pointer group">
            <div class="flex items-center justify-between text-xs mb-1">
                <span id="league-name" class="font-bold text-white flex items-center gap-1">
                    Bronze <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </span>
                <span id="league-level-text" class="text-gray-400 font-medium">1 <span class="text-gray-600">/ 10</span></span>
            </div>
            <div class="w-full h-2.5 bg-[#272a2f] rounded-full overflow-hidden border border-[#363a42] p-[1px]">
                <div id="league-progress-bar" class="h-full league-gradient rounded-full transition-all duration-300" style="width: 15%"></div>
            </div>
        </div>

        <!-- Плашка Прибыль в час -->
        <div class="bg-[#272a2f] border border-[#383c44] rounded-2xl px-3 py-1.5 flex items-center gap-2.5 shrink-0 shadow-md">
            <div class="text-right">
                <div class="text-[10px] text-gray-400 font-medium flex items-center justify-end gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 live-dot"></span>
                    Прибыль в час
                </div>
                <div class="flex items-center justify-end gap-1 mt-0.5">
                    <span class="coin-mini-svg"></span>
                    <span id="pph-display" class="text-xs font-extrabold text-white">+0</span>
                    <button onclick="showToast('Пассивный доход начисляется каждую секунду, даже когда игра закрыта!')" class="w-4 h-4 rounded-full bg-[#383c44] text-gray-300 text-[10px] font-bold flex items-center justify-center ml-0.5">i</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ОСНОВНАЯ ИГРОВАЯ ОБЛАСТЬ (С желтым неоновым ободком) -->
    <main class="main-board-glow">
        
        <!-- ==================== ВКЛАДКА 1: БИРЖА (ГЛАВНЫЙ ЭКРАН) ==================== -->
        <section id="tab-exchange" class="tab-content flex-1 flex flex-col justify-between px-4 pt-3 pb-24 overflow-y-auto no-scrollbar">
            
            <!-- 3 Ежедневные карточки (Награда, Шифр, Комбо) -->
            <div class="grid grid-cols-3 gap-2 shrink-0">
                <!-- Ежедневная награда -->
                <button onclick="switchTab('earn'); setTimeout(openDailyRewardModal, 100)" class="bg-[#272a2f] hover:bg-[#2f333a] border border-[#353941] rounded-2xl p-2 flex flex-col items-center relative active:scale-95 transition">
                    <span id="dot-daily-reward" class="w-2 h-2 rounded-full bg-white absolute top-2 right-2"></span>
                    <div class="w-8 h-8 mb-1 flex items-center justify-center text-xl">📅</div>
                    <span class="text-[10px] font-bold text-white leading-tight text-center">Ежедневная награда</span>
                    <span id="timer-daily-reward" class="text-[9px] text-gray-400 mt-0.5">Доступно</span>
                </button>

                <!-- Ежедневный шифр (Морзе) -->
                <button id="cipher-card-btn" onclick="toggleCipherMode()" class="bg-[#272a2f] hover:bg-[#2f333a] border border-[#353941] rounded-2xl p-2 flex flex-col items-center relative active:scale-95 transition">
                    <span id="dot-daily-cipher" class="w-2 h-2 rounded-full bg-white absolute top-2 right-2"></span>
                    <div class="w-8 h-8 mb-1 flex items-center justify-center text-xl">🔐</div>
                    <span class="text-[10px] font-bold text-white leading-tight text-center">Ежедневный шифр</span>
                    <span id="timer-daily-cipher" class="text-[9px] text-[#f3ba2f] mt-0.5">+1 000 000</span>
                </button>

                <!-- Комбо -->
                <button onclick="switchTab('mine')" class="bg-[#272a2f] hover:bg-[#2f333a] border border-[#353941] rounded-2xl p-2 flex flex-col items-center relative active:scale-95 transition">
                    <span id="dot-daily-combo" class="w-2 h-2 rounded-full bg-white absolute top-2 right-2"></span>
                    <div class="w-8 h-8 mb-1 flex items-center justify-center text-xl">🎁</div>
                    <span class="text-[10px] font-bold text-white leading-tight text-center">Комбо</span>
                    <span id="combo-progress-mini" class="text-[9px] text-[#f3ba2f] mt-0.5">0 / 3</span>
                </button>
            </div>

            <!-- Панель ввода Азбуки Морзе (появляется при нажатии на Ежедневный шифр) -->
            <div id="cipher-bar" class="hidden bg-[#272a2f] border border-red-500/40 rounded-2xl px-3 py-2 mt-2 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-red-400">ШИФР:</span>
                    <div id="cipher-letters" class="flex items-center gap-1.5 text-sm font-black tracking-widest text-white">
                        <span class="opacity-30">_</span><span class="opacity-30">_</span><span class="opacity-30">_</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="cipher-current-morse" class="text-xs font-mono text-[#f3ba2f] bg-black/40 px-2 py-0.5 rounded">• / —</span>
                    <button onclick="showCipherHint()" class="text-[10px] bg-red-500/20 text-red-300 px-2 py-1 rounded-lg font-bold">Подсказка</button>
                </div>
            </div>

            <!-- Большой счетчик монет -->
            <div class="flex items-center justify-center gap-2.5 my-2 shrink-0">
                <!-- Большая 3D золотая монета -->
                <svg class="w-11 h-11 drop-shadow-[0_4px_12px_rgba(243,186,47,0.45)] shrink-0" viewBox="0 0 64 64" fill="none">
                    <circle cx="32" cy="32" r="30" fill="url(#coinGradOuter)"/>
                    <circle cx="32" cy="32" r="24" fill="url(#coinGradInner)" stroke="#fde047" stroke-width="1.5"/>
                    <path d="M23 20H28V29H36V20H41V44H36V34H28V44H23V20Z" fill="#78350f" opacity="0.85"/>
                    <path d="M23 19H28V28H36V19H41V43H36V33H28V43H23V19Z" fill="#fef08a"/>
                    <defs>
                        <linearGradient id="coinGradOuter" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fde047"/>
                            <stop offset="0.5" stop-color="#f59e0b"/>
                            <stop offset="1" stop-color="#b45309"/>
                        </linearGradient>
                        <linearGradient id="coinGradInner" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#facc15"/>
                            <stop offset="1" stop-color="#d97706"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span id="balance-display" class="text-4xl sm:text-[42px] font-black tracking-tight text-white tabular-nums">0</span>
            </div>

            <!-- ГЛАВНЫЙ ИНТЕРАКТИВНЫЙ ХОМЯК -->
            <div id="hamster-stage" class="flex-1 flex items-center justify-center my-1 relative">
                <!-- Индикатор активного Turbo -->
                <div id="turbo-badge" class="hidden absolute -top-2 bg-gradient-to-r from-amber-500 to-red-500 text-white text-[11px] font-black px-3 py-0.5 rounded-full shadow-lg animate-bounce z-20">
                    🔥 TURBO x5 АКТИВЕН!
                </div>

                <div id="hamster-btn" class="hamster-outer-ring w-[245px] h-[245px] sm:w-[270px] sm:h-[270px] rounded-full p-3.5 flex items-center justify-center">
                    <div class="hamster-inner-circle w-full h-full rounded-full flex items-center justify-center overflow-hidden relative">
                        <!-- Векторная иллюстрация CEO Хомяка в деловом костюме -->
                        <svg id="hamster-svg" class="w-[86%] h-[86%] drop-shadow-[0_12px_18px_rgba(0,0,0,0.65)] pointer-events-none" viewBox="0 0 240 240" fill="none">
                            <defs>
                                <radialGradient id="furGrad" cx="50%" cy="35%" r="60%">
                                    <stop offset="0%" stop-color="#f2be7e"/>
                                    <stop offset="65%" stop-color="#d69249"/>
                                    <stop offset="100%" stop-color="#9e6224"/>
                                </radialGradient>
                                <radialGradient id="bellyGrad" cx="50%" cy="40%" r="55%">
                                    <stop offset="0%" stop-color="#fff4e4"/>
                                    <stop offset="100%" stop-color="#e5c8a3"/>
                                </radialGradient>
                                <linearGradient id="suitGrad" x1="0" y1="140" x2="240" y2="240" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#272b33"/>
                                    <stop offset="100%" stop-color="#111317"/>
                                </linearGradient>
                                <linearGradient id="tieGrad" x1="120" y1="165" x2="120" y2="230" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#ef4444"/>
                                    <stop offset="100%" stop-color="#991b1b"/>
                                </linearGradient>
                            </defs>

                            <!-- Уши -->
                            <g id="hamster-ears">
                                <circle cx="66" cy="64" r="24" fill="#c7833c" stroke="#8c5319" stroke-width="3"/>
                                <circle cx="68" cy="66" r="14" fill="#f4a2b8"/>
                                <circle cx="174" cy="64" r="24" fill="#c7833c" stroke="#8c5319" stroke-width="3"/>
                                <circle cx="172" cy="66" r="14" fill="#f4a2b8"/>
                            </g>

                            <!-- Голова и пухлые щечки -->
                            <path d="M52 115C52 68 80 42 120 42C160 42 188 68 188 115C188 132 198 148 192 166C185 186 156 194 120 194C84 194 55 186 48 166C42 148 52 132 52 115Z" fill="url(#furGrad)"/>

                            <!-- Светлая мордочка -->
                            <ellipse cx="120" cy="144" rx="54" ry="38" fill="url(#bellyGrad)"/>

                            <!-- Брови (уверенный CEO взгляд) -->
                            <path d="M78 93C86 88 96 90 102 95" stroke="#5c3610" stroke-width="4.5" stroke-linecap="round"/>
                            <path d="M162 93C154 88 144 90 138 95" stroke="#5c3610" stroke-width="4.5" stroke-linecap="round"/>

                            <!-- Глаза -->
                            <g id="hamster-eyes">
