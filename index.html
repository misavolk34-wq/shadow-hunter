<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RichLife: Investor Tycoon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0f19;
    --card: #141c2f;
    --card-border: #1e293b;
    --accent: #10b981;
    --accent-glow: rgba(16, 185, 129, 0.3);
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; padding-bottom: 80px; overflow-x: hidden;
  }
  .hidden { display: none !important; }

  /* Верхняя шапка */
  .header {
    padding: 16px; display: flex; justify-content: space-between; align-items: center;
    background: rgba(20, 28, 47, 0.8); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
  }
  .balance-title { font-size: 13px; color: var(--muted); }
  .balance-amount { font-size: 26px; font-weight: 800; color: #fff; margin-top: 2px; }

  .container { padding: 16px; max-width: 500px; margin: 0 auto; }

  /* Карточки */
  .card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 20px; padding: 18px; margin-bottom: 16px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
  }

  /* Секция тапалки */
  .earn-stats {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .stat-box { background: #0f172a; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--card-border); }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-val { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 2px; }

  .progress-container { margin: 12px 0 20px 0; }
  .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .progress-bar-bg { width: 100%; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; border: 1px solid var(--card-border); }
  .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }

  /* Большая кнопка тапа с отпечатком */
  .tap-zone {
    height: 220px; background: linear-gradient(145deg, #0f172a, #141c2f);
    border: 2px dashed var(--card-border); border-radius: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; overflow: hidden; transition: transform 0.05s;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }
  .tap-zone:active { transform: scale(0.97); border-color: var(--accent); }
  .fingerprint-icon { font-size: 56px; opacity: 0.8; filter: drop-shadow(0 0 10px var(--accent-glow)); margin-bottom: 10px; }
  .tap-hint { font-size: 13px; color: var(--muted); font-weight: 500; }

  /* Карточки недвижимости */
  .property-card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; overflow: hidden; margin-bottom: 16px;
  }
  .property-img { height: 140px; background-size: cover; background-position: center; position: relative; }
  .property-income-badge {
    position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #fff;
  }
  .property-body { padding: 14px; display: flex; justify-content: space-between; align-items: center; }
  .property-price { font-size: 18px; font-weight: 800; color: #fff; }
  .property-loc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Кнопки */
  .btn {
    background: var(--accent); color: #000; border: none; padding: 10px 20px;
    border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer;
    box-shadow: 0 4px 15px var(--accent-glow); transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }

  /* Навигация снизу */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20, 28, 47, 0.95);
    backdrop-filter: blur(12px); border-top: 1px solid var(--card-border);
    display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px; z-index: 100;
  }
  .nav-item {
    background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px;
  }
  .nav-item.active { color: var(--accent); }

  /* Анимация вылетающих денег при тапе */
  .floating-num {
    position: absolute; font-weight: 900; font-size: 20px; color: var(--accent);
    pointer-events: none; animation: floatUp 0.6s forwards; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.8); }
    100% { opacity: 0; transform: translateY(-55px) scale(1.2); }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="balance-title">Баланс</div>
    <div class="balance-amount">$<span id="main-balance">80,800.00</span></div>
  </div>
  <div style="background: var(--card); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: 700;">
    💼 Ур. <span id="player-lvl">1</span>
  </div>
</div>

<div class="container">
  <!-- ВКЛАДКА 1: ЗАРАБОТОК (ТАПАЛКА) -->
  <div id="tab-earn" class="card">
    <div class="earn-stats">
      <div class="stat-box">
        <div class="stat-label">Доход в час</div>
        <div class="stat-val">$<span id="profit-hour">0</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">За тап</div>
        <div class="stat-val">+$<span id="tap-power">1.00</span></div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-info">
        <span>Прогресс уровня</span>
        <span>$<span id="lvl-progress">0</span> / <span id="lvl-target">1,800</span></span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <div class="tap-zone" id="tap-zone" onclick="handleTap(event)">
      <div class="fingerprint-icon">🛡️</div>
      <div class="tap-hint">Нажмите в этой области для заработка</div>
    </div>
  </div>

  <!-- ВКЛАДКА 2: НЕДВИЖИМОСТЬ -->
  <div id="tab-realty" class="hidden">
    <h3 style="margin: 0 0 16px 0; font-size: 18px;">Инвестиции в недвижимость</h3>
    <div id="properties-list"></div>
  </div>

  <!-- ВКЛАДКА 3: ПРОКАЧКА -->
  <div id="tab-upgrade" class="hidden card">
    <h3 style="margin-top:0; font-size:18px;">Улучшение навыков</h3>
    <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:14px; border-radius:14px; border:1px solid var(--card-border);">
      <div>
        <div style="font-weight:700; font-size:14px;">Сила клика (+1$)</div>
        <div style="font-size:12px; color:var(--muted);">Стоимость: $<span id="upgrade-cost">50.00</span></div>
      </div>
      <button class="btn" onclick="buyTapUpgrade()">Улучшить</button>
    </div>
  </div>
</div>

<!-- НИЖНЯЯ НАВИГАЦИЯ -->
<div class="nav">
  <button class="nav-item active" onclick="switchTab('earn', this)"><span>💸</span>Заработок</button>
  <button class="nav-item" onclick="switchTab('realty', this)"><span>🏠</span>Недвижимость</button>
  <button class="nav-item" onclick="switchTab('upgrade', this)"><span>⚡</span>Прокачка</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }

let game = {
  balance: 80800.00,
  profitHour: 10800,
  tapPower: 1.00,
  level: 1,
  exp: 0,
  expTarget: 1800,
  upgradeCost: 50,
  properties: [
    { id: 1, name: 'Семейный дом', loc: 'Икитос, Перу', price: 62000, income: 998, owned: false, img: 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=500&auto=format&fit=crop&q=60' },
    { id: 2, name: 'Особняк в пригороде', loc: 'Остин, Техас', price: 125000, income: 2150, owned: false, img: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=500&auto=format&fit=crop&q=60' },
    { id: '3', name: 'Небоскреб Центр', loc: 'Майами, США', price: 450000, income: 8400, owned: false, img: 'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=500&auto=format&fit=crop&q=60' }
  ]
};

function updateUI() {
  document.getElementById('main-balance').textContent = game.balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  document.getElementById('profit-hour').textContent = game.profitHour.toLocaleString();
  document.getElementById('tap-power').textContent = game.tapPower.toFixed(2);
  document.getElementById('player-lvl').textContent = game.level;
  document.getElementById('lvl-progress').textContent = Math.floor(game.exp).toLocaleString();
  document.getElementById('lvl-target').textContent = game.expTarget.toLocaleString();
  
  let fillPercent = Math.min(100, (game.exp / game.expTarget) * 100);
  document.getElementById('progress-fill').style.width = fillPercent + '%';
  document.getElementById('upgrade-cost').textContent = game.upgradeCost.toLocaleString();
  
  renderProperties();
}

function handleTap(e) {
  game.balance += game.tapPower;
  game.exp += game.tapPower;
  
  if (game.exp >= game.expTarget) {
    game.level++;
    game.exp = 0;
    game.expTarget = Math.floor(game.expTarget * 2.2);
  }

  // Анимация вылетающей суммы в месте клика
  const zone = document.getElementById('tap-zone');
  const rect = zone.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const floatEl = document.createElement('div');
  floatEl.className = 'floating-num';
  floatEl.textContent = `+$${game.tapPower.toFixed(0)}`;
  floatEl.style.left = `${x}px`;
  floatEl.style.top = `${y}px`;
  zone.appendChild(floatEl);

  setTimeout(() => floatEl.remove(), 600);

  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  updateUI();
}

function buyTapUpgrade() {
  if (game.balance < game.upgradeCost) return alert('Недостаточно средств!');
  game.balance -= game.upgradeCost;
  game.tapPower += 1.0;
  game.upgradeCost = Math.floor(game.upgradeCost * 1.6);
  updateUI();
}

function renderProperties() {
  const list = document.getElementById('properties-list');
  list.innerHTML = game.properties.map(p => `
    <div class="property-card">
      <div class="property-img" style="background-image: url('${p.img}')">
        <div class="property-income-badge">$${p.income.toLocaleString()} income per hour</div>
      </div>
      <div class="property-body">
        <div>
          <div class="property-price">$${p.price.toLocaleString()}</div>
          <div class="property-loc">📍 ${p.loc}</div>
        </div>
        <button class="btn" onclick="buyProperty(${p.id})" ${p.owned ? 'style="background:#334155; color:#94a3b8;" disabled' : ''}>
          ${p.owned ? 'Куплено' : 'Купить'}
        </button>
      </div>
    </div>
  `).join('');
}

function buyProperty(id) {
  const prop = game.properties.find(p => p.id === id);
  if (prop.owned) return;
  if (game.balance < prop.price) return alert('Не хватает денег на балансе!');
  
  game.balance -= prop.price;
  prop.owned = true;
  game.profitHour += prop.income;
  updateUI();
  alert(`Поздравляем с покупкой: ${prop.name}!`);
}

// Пассивный доход каждую секунду
setInterval(() => {
  if (game.profitHour > 0) {
    game.balance += game.profitHour / 3600;
    updateUI();
  }
}, 1000);

function switchTab(id, btn) {
  ['earn', 'realty', 'upgrade'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
  document.getElementById('tab-' + id).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

updateUI();
</script>
</body>
</html>
