<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МирЧат Онлайн</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-color: #131b2e;
            --panel-glass: rgba(19, 27, 46, 0.85);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --gold-color: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            height: 100vh; 
            height: 100dvh;
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* Верхняя шапка */
        .app-header {
            background: var(--panel-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .user-mini-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .user-details .name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .user-details .coins {
            font-size: 0.75rem;
            color: var(--gold-color);
            font-weight: 600;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
        }

        /* Лента сообщений */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message-card {
            background: var(--panel-glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 14px;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.75rem;
        }

        .sender-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clan-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.7rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .sender-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .message-time {
            color: var(--text-muted);
        }

        .message-text {
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            color: #e2e8f0;
        }

        /* Поле ввода сообщения */
        .chat-input-area {
            padding: 12px 16px;
            background: var(--panel-glass);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input, select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .send-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        /* Экраны разделов */
        .section-view {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-box {
            background: var(--panel-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .card-box h3 {
            font-size: 1.05rem;
            margin-bottom: 12px;
            color: #818cf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Нижнее меню (Bottom Navigation) */
        .bottom-nav {
            background: var(--panel-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 6px env(safe-area-inset-bottom, 8px);
            z-index: 10;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
            transition: all 0.2s;
            flex: 1;
        }

        .nav-item .icon {
            font-size: 1.3rem;
            transition: transform 0.2s;
        }

        .nav-item.active {
            color: #818cf8;
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-item.active .icon {
            transform: scale(1.1);
        }

        /* Кнопки общие */
        .btn-action {
            background: var(--accent-gradient);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-action:active {
            opacity: 0.85;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* Сетка подарков */
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .gift-item {
            background: var(--panel-glass);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .gift-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            animation: floatGift 3s ease-in-out infinite;
        }

        @keyframes floatGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .gift-price {
            font-weight: 700;
            color: var(--gold-color);
            font-size: 0.9rem;
            margin: 8px 0;
        }

        /* Список кланов */
        .clan-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .clan-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Шапка телефона -->
    <header class="app-header">
        <div class="user-mini-profile">
            <div class="avatar">👑</div>
            <div class="user-details">
                <div class="name" id="my-name">Игрок</div>
                <div class="coins"><span id="my-coins">1500</span> 🪙</div>
            </div>
        </div>
        <div class="header-title" id="current-section-title">Всемирный чат</div>
    </header>

    <!-- Основная рабочая область -->
    <div class="main-content">
        
        <!-- Чат (Всемирный / Клановый) -->
        <div id="section-chat" class="chat-container" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
            <div class="chat-messages" id="messages-list"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Написать сообщение..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- Управление кланами -->
        <div id="section-clans-hub" class="section-view" style="display: none;">
            <div class="card-box">
                <h3>🛡️ Ваш клан</h3>
                <div id="my-clan-info"></div>
            </div>
            <div class="card-box">
                <h3>🏰 Список кланов</h3>
                <div class="clan-list" id="clans-list"></div>
            </div>
        </div>

        <!-- Магазин подарков -->
        <div id="section-gifts" class="section-view" style="display: none;">
            <div style="margin-bottom: 4px;">
                <h3 style="color: #818cf8; font-size: 1.1rem; margin-bottom: 4px;">🎁 Магазин подарков</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Дарите подарки прямо в чат, чтобы порадовать участников!</p>
            </div>
            <div class="gift-grid" id="gift-store-grid"></div>
        </div>

    </div>

    <!-- Нижняя навигация (Bottom Bar) -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-world" onclick="switchTab('world')">
            <span class="icon">💬</span>
            <span>Мир</span>
        </button>
        <button class="nav-item" id="nav-clan" onclick="switchTab('clan')">
            <span class="icon">🛡️</span>
            <span>Клан</span>
        </button>
        <button class="nav-item" id="nav-clans-hub" onclick="switchTab('clans-hub')">
            <span class="icon">🏰</span>
            <span>База</span>
        </button>
        <button class="nav-item" id="nav-gifts" onclick="switchTab('gifts')">
            <span class="icon">🎁</span>
            <span>Подарки</span>
        </button>
    </nav>

    <script>
        let state = {
            username: "Игрок_" + Math.floor(Math.random() * 900 + 100),
            coins: 1500,
            clanId: null,
            activeTab: 'world'
        };

        const giftStore = [
            { id: 1, name: "🌟 Звезда", price: 100, icon: "🌟", desc: "Знак внимания" },
            { id: 2, name: "🏆 Кубок", price: 300, icon: "🏆", desc: "Символ успеха" },
            { id: 3, name: "👑 Корона", price: 750, icon: "👑", desc: "Для лидера" },
            { id: 4, name: "🚀 Ракета", price: 1500, icon: "🚀", desc: "Эпический буст" }
        ];

        let clans = [
            { id: 1, name: "Cyber Dragons", tag: "DRGN", treasury: 2500, level: 2, members: 3 },
            { id: 2, name: "Phoenix Legion", tag: "PHNX", treasury: 1200, level: 1, members: 1 }
        ];

        let messages = [
            { id: 1, type: 'world', sender: "Система", text: "Добро пожаловать в МирЧат Онлайн! Интерфейс оптимизирован под телефон.", time: "12:00", badge: "ADMIN" }
        ];

        window.onload = function() {
            document.getElementById('my-name').innerText = state.username;
            updateUI();
            renderMessages();
            renderGiftStore();
            renderClansList();
            renderMyClanInfo();
        };

        function updateUI() {
            document.getElementById('my-coins').innerText = state.coins;
        }

        function switchTab(tabName) {
            state.activeTab = tabName;
            
            document.getElementById('section-chat').style.display = 'none';
            document.getElementById('section-clans-hub').style.display = 'none';
            document.getElementById('section-gifts').style.display = 'none';

            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('nav-' + tabName);
            if (activeBtn) activeBtn.classList.add('active');

            const titles = {
                'world': 'Всемирный чат',
                'clan': 'Клановый чат',
                'clans-hub': 'Управление кланами',
                'gifts': 'Магазин подарков'
            };
            document.getElementById('current-section-title').innerText = titles[tabName];

            if (tabName === 'world' || tabName === 'clan') {
                document.getElementById('section-chat').style.display = 'flex';
                renderMessages();
            } else if (tabName === 'clans-hub') {
                document.getElementById('section-clans-hub').style.display = 'flex';
                renderClansList();
                renderMyClanInfo();
            } else if (tabName === 'gifts') {
                document.getElementById('section-gifts').style.display = 'flex';
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            if (state.activeTab === 'clan' && !state.clanId) {
                alert('Вы не состоите в клане! Вступите в клан во вкладке «База».');
                return;
            }

            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messages.push({
                id: Date.now(),
                type: state.activeTab,
                sender: state.username,
                text: text,
                time: timeNow,
                badge: state.clanId ? getClanTag(state.clanId) : ''
            });

            state.coins += 5; // бонус за активность
            updateUI();

            input.value = '';
            renderMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function renderMessages() {
            const list = document.getElementById('messages-list');
            list.innerHTML = '';

            const filtered = messages.filter(m => m.type === state.activeTab);

            if (filtered.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 0.9rem;">Здесь пока пусто. Напишите первое сообщение!</div>`;
                return;
            }

            filtered.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message-card';
                div.innerHTML = `
                    <div class="message-header">
                        <div class="sender-info">
                            ${msg.badge ? `<span class="clan-badge">${msg.badge}</span>` : ''}
                            <span class="sender-name">${msg.sender}</span>
                        </div>
                        <span class="message-time">${msg.time}</span>
                    </div>
                    <div class="message-text">${msg.text}</div>
                `;
                list.appendChild(div);
            });
            list.scrollTop = list.scrollHeight;
        }

        function renderGiftStore() {
            const grid = document.getElementById('gift-store-grid');
            grid.innerHTML = '';
            giftStore.forEach(gift => {
                const card = document.createElement('div');
                card.className = 'gift-item';
                card.innerHTML = `
                    <div>
                        <div class="gift-icon">${gift.icon}</div>
                        <h4 style="font-size: 0.95rem; margin-bottom: 2px;">${gift.name}</h4>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">${gift.desc}</p>
                    </div>
                    <div>
                        <div class="gift-price">${gift.price} 🪙</div>
                        <button class="btn-action" style="padding: 6px; font-size: 0.8rem;" onclick="buyGift(${gift.id})">Отправить</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function buyGift(giftId) {
            const gift = giftStore.find(g => g.id === giftId);
            if (state.coins < gift.price) {
                alert('Недостаточно монет! Пишите сообщения в чате, чтобы заработать.');
                return;
            }
            state.coins -= gift.price;
            updateUI();

            messages.push({
                id: Date.now(),
                type: state.activeTab,
                sender: "🎁 Подарок",
                text: `<b>${state.username}</b> отправил в чат подарок ${gift.icon} <b>${gift.name}</b>!`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                badge: state.clanId ? getClanTag(state.clanId) : ''
            });

            switchTab(state.activeTab);
            alert(`Подарок ${gift.name} успешно отправлен в эфир!`);
        }

        function getClanTag(id) {
            const clan = clans.find(c => c.id === id);
            return clan ? clan.tag : '';
        }

        function renderClansList() {
            const list = document.getElementById('clans-list');
            list.innerHTML = '';
            clans.forEach(clan => {
                const isMyClan = state.clanId === clan.id;
                const div = document.createElement('div');
                div.className = 'clan-card';
                div.innerHTML = `
                    <div>
                        <h4 style="color: #818cf8; font-size: 0.95rem;">[${clan.tag}] ${clan.name}</h4>
                        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Казна: ${clan.treasury} 🪙 | Ур. ${clan.level}</p>
                    </div>
                    ${isMyClan ? '<span style="color: var(--success-color); font-weight: bold; font-size: 0.85rem;">Ваш</span>' : `<button class="btn-action" style="padding: 5px 10px; font-size: 0.75rem; width: auto;" onclick="joinClan(${clan.id})">Вступить</button>`}
                `;
                list.appendChild(div);
            });
        }

        function renderMyClanInfo() {
            const container = document.getElementById('my-clan-info');
            if (!state.clanId) {
                container.innerHTML = `
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">Вы не состоите в клане. Создайте свой или вступите в готовый.</p>
                    <button class="btn-action" onclick="showCreateClanModal()">Создать клан (500 🪙)</button>
                `;
                return;
            }
            const clan = clans.find(c => c.id === state.clanId);
            container.innerHTML = `
                <h4 style="color: #818cf8; font-size: 1.1rem; margin-bottom: 4px;">[${clan.tag}] ${clan.name}</h4>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Казна: <b style="color: var(--gold-color);">${clan.treasury} 🪙</b> | Уровень: <b>${clan.level}</b></p>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-action" style="padding: 8px; font-size: 0.8rem;" onclick="donateToClan(100)">Внести 100 🪙</button>
                    <button class="btn-action btn-danger" style="padding: 8px; font-size: 0.8rem;" onclick="leaveClan()">Выйти</button>
                </div>
            `;
        }

        function showCreateClanModal() {
            const name = prompt("Название клана:");
            if (!name) return;
            const tag = prompt("Тег клана (до 4 символов):", "TEAM").toUpperCase();
            if (!tag) return;

            if (state.coins < 500) {
                alert('Нужно 500 монет!');
                return;
            }

            state.coins -= 500;
            updateUI();

            const newClan = {
                id: Date.now(),
                name: name,
                tag: tag.substring(0, 4),
                treasury: 100,
                level: 1,
                members: 1
            };
            clans.push(newClan);
            state.clanId = newClan.id;
            
            renderClansList();
            renderMyClanInfo();
            alert('Клан создан!');
        }

        function joinClan(clanId) {
            state.clanId = clanId;
            const clan = clans.find(c => c.id === clanId);
            if (clan) clan.members++;

            renderClansList();
            renderMyClanInfo();
            alert(`Вы вступили в [${clan.tag}]!`);
        }

        function leaveClan() {
            state.clanId = null;
            renderClansList();
            renderMyClanInfo();
            alert('Вы вышли из клана.');
        }

        function donateToClan(amount) {
            if (state.coins < amount) {
                alert('Недостаточно монет!');
                return;
            }
            state.coins -= amount;
            updateUI();

            const clan = clans.find(c => c.id === state.clanId);
            if (clan) {
                clan.treasury += amount;
                if (clan.treasury >= clan.level * 2000) {
                    clan.level++;
                    alert(`Клан повысил уровень до ${clan.level}! 🎉`);
                }
            }

            renderMyClanInfo();
            renderClansList();
            alert('Пожертвование зачислено!');
        }
    </script>
</body>
</html>
