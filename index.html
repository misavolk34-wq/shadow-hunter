<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shadow Hunter</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      padding-top: 40px;
    }
    h1 { text-align: center; font-size: 26px; color: #a78bfa; margin-bottom: 8px; }
    .subtitle { text-align: center; opacity: 0.7; margin-bottom: 30px; font-size: 15px; }
    .classes { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
    .class-card {
      background: #1a1a24;
      border: 2px solid #2a2a3a;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
    }
    .class-card.selected { border-color: #7c3aed; background: #221a35; }
    .class-card h3 { font-size: 18px; margin-bottom: 6px; color: #c4b5fd; }
    .class-card p { font-size: 13px; opacity: 0.75; line-height: 1.4; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #2a2a3a;
      background: #1a1a24;
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }
    input:focus { border-color: #7c3aed; }
    .btn {
      width: 100%;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
    }
    .btn:disabled { background: #3f3f46; }
    .message {
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }
    .success { background: #14532d; color: #86efac; }
    .error { background: #450a0a; color: #fca5a5; }
  </style>
</head>
<body>
  <h1>Shadow Hunter</h1>
  <p class="subtitle">Создай своего охотника</p>

  <div class="classes">
    <div class="class-card" onclick="selectClass('warrior', this)">
      <h3>Воин</h3>
      <p>Высокое здоровье и защита. Идеален для ближнего боя.</p>
    </div>
    <div class="class-card" onclick="selectClass('assassin', this)">
      <h3>Убийца</h3>
      <p>Высокий урон и шанс критического удара. Быстрый и смертоносный.</p>
    </div>
    <div class="class-card" onclick="selectClass('mage', this)">
      <h3>Маг</h3>
      <p>Мощные заклинания, но хрупкий. Силён на расстоянии.</p>
    </div>
  </div>

  <input type="text" id="nameInput" placeholder="Введи имя охотника" maxlength="16">
  <button class="btn" id="createBtn" onclick="createCharacter()" disabled>Создать персонажа</button>
  <div id="message" class="message"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const SUPABASE_URL = 'https://optytvvqevlzmzqlcgah.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Nr1PlzEcCy0SM9G5MXHvXQ_XDvs2RJM';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedClass = null;

    const classStats = {
      warrior:  { hp: 120, attack: 12, defense: 15, speed: 8,  crit_chance: 5,  crit_damage: 150 },
      assassin: { hp: 90,  attack: 18, defense: 8,  speed: 14, crit_chance: 15, crit_damage: 180 },
      mage:     { hp: 80,  attack: 20, defense: 6,  speed: 10, crit_chance: 8,  crit_damage: 160 }
    };

    function selectClass(className, element) {
      document.querySelectorAll('.class-card').forEach(card => {
        card.classList.remove('selected');
      });
      element.classList.add('selected');
      selectedClass = className;
      checkForm();
    }

    function checkForm() {
      const name = document.getElementById('nameInput').value.trim();
      const btn = document.getElementById('createBtn');
      btn.disabled = !(selectedClass && name.length >= 2);
    }

    document.getElementById('nameInput').addEventListener('input', checkForm);

    async function createCharacter() {
      const name = document.getElementById('nameInput').value.trim();
      if (!selectedClass || name.length < 2) return;

      const btn = document.getElementById('createBtn');
      btn.disabled = true;
      btn.textContent = 'Создание...';

      const stats = classStats[selectedClass];
      const telegramId = tg.initDataUnsafe?.user?.id || null;

      const { data, error } = await supabaseClient
        .from('characters1')
        .insert([{
          telegram_id: telegramId,
          name: name,
          class: selectedClass,
          level: 1,
          exp: 0,
          hp: stats.hp,
          attack: stats.attack,
          defense: stats.defense,
          speed: stats.speed,
          crit_chance: stats.crit_chance,
          crit_damage: stats.crit_damage,
          gold: 100
        }]);

      const messageEl = document.getElementById('message');
      messageEl.style.display = 'block';

      if (error) {
        messageEl.className = 'message error';
        messageEl.textContent = 'Ошибка: ' + error.message;
        btn.disabled = false;
        btn.textContent = 'Создать персонажа';
      } else {
        messageEl.className = 'message success';
        messageEl.textContent = 'Охотник ' + name + ' успешно создан!';
        btn.textContent = 'Создано';
      }
    }
  </script>
</body>
</html>
