<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Простая Тапалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
    --primary: #3b82f6; --text: #0f172a; --muted: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; padding-bottom: 80px; overflow-x: hidden;
  }
  .hidden { display: none !important; }
  .header {
    padding: 14px 16px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 50; font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .container { padding: 20px; max-width: 500px; margin: 0 auto; text-align: center; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  .score-display { font-size: 42px; font-weight: 900; color: var(--primary); margin: 10px 0; }
  
  /* Большая кнопка тапа */
  .tap-btn {
    width: 200px; height: 200px; background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border: none; border-radius: 50%; color: white; font-size: 60px;
    display: flex; align-items: center; justify-content: center; margin: 30px auto;
    cursor: pointer; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    transition: transform 0.08s; position: relative; outline: none;
  }
  .tap-btn:active { transform: scale(0.92); }

  /* Навигация */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px; z-index: 100;
  }
  .nav-item { background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; padding: 8px; }
  .nav-item.active { color: var(--primary); }

  /* Чат и Топ */
  .chat-box { height: 240px; overflow-y: auto; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px; text-align: left; font-size: 12px; display: flex; flexDirection: column; gap: 6px; }
  .chat-msg { background: #fff; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }
  .top-row { display: flex; justify-content: space-between; padding: 10px 14px; background: #f8fafc; border-radius: 10px; margin-bottom: 6px; font-weight: 700; font-size: 13px; border: 1px solid var(--border); }
  
  .floating-num {
    position: absolute; font-weight: 900; font-size: 22px; color: #10b981;
    pointer-events: none; animation: floatUp 0.6s forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.8); }
    100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
  }
</style>
</head>
<body>

<div class="header">
  <div>👤 <span id="user-name">Игрок</span></div>
  <div id="live-clock">00:00:00</div>
</div>

<div class="container">
  <!-- 1. ТАПАЛКА -->
  <div id="tab-tap" class="card">
    <div style="font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase;">Ваш баланс монеток</div>
    <div class="score-display"><span id="score">0</span></div>
    
    <button class="tap-btn" id="tap-target" onclick="onTap(event)">🪙</button>
    <div style="font-size: 12px; color: var(--muted);">1 тап = 1 монетка</div>
  </div>

  <!-- 2. ТОП ИГРОКОВ -->
  <div id="tab-top" class="hidden card">
    <h3 style="margin-top:0; font-size:16px;">🏆 Топ Таперов</h3>
    <div id="top-list">Загрузка топа...</div>
  </div>

  <!-- 3. ОБЩИЙ ЧАТ -->
  <div id="tab-chat" class="hidden card">
    <h3 style="margin-top:0; font-size:16px;">💬 Общий Чат</h3>
    <div class="chat-box" id="chat-box">Загрузка чата...</div>
    <div style="display:flex; gap:6px;">
      <input type="text" id="chat-input" class="card" style="margin:0; padding:10px; font-size:12px; flex:1;" placeholder="Сообщение...">
      <button style="background:var(--primary); color:#fff; border:none; padding:10px 16px; border-radius:12px; font-weight:bold; cursor:pointer;" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-item active" onclick="switchTab('tap', this)">🪙 Тапать</button>
  <button class="nav-item" onclick="switchTab('top', this)">🏆 Топ</button>
  <button class="nav-item" onclick="switchTab('chat', this)">💬 Чат</button>
</div>

<script>
const SUPABASE_URL = "https://optytvvqevlzmzqlcgah.supabase.co";
const SUPABASE_KEY = "sb_publishable_NrlPlzEcCy0SM9G5MXHvXQ_XDvs2RJM";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }

let userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : ('guest_' + Math.floor(Math.random()*90000));
let userName = tg?.initDataUnsafe?.user?.first_name || 'Игрок';
document.getElementById('user-name').textContent = userName;

let score = parseInt(localStorage.getItem('tap_score_' + userId)) || 0;
document.getElementById('score').textContent = score;

// Часы и дата
setInterval(() => {
  const now = new Date();
  document.getElementById('live-clock').textContent = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
}, 1000);

// Тап
function onTap(e) {
  score += 1;
  document.getElementById('score').textContent = score;
  localStorage.setItem('tap_score_' + userId, score);

  // Анимация числа
  const btn = document.getElementById('tap-target');
  const rect = btn.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;

  const floatEl = document.createElement('div');
  floatEl.className = 'floating-num';
  floatEl.textContent = '+1';
  floatEl.style.left = `${x}px`; floatEl.style.top = `${y}px`;
  btn.appendChild(floatEl);
  setTimeout(() => floatEl.remove(), 600);

  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  
  // Синхронизация с облаком (раз в 10 тапов или при смене)
  if (score % 5 === 0) {
    syncCloudScore();
  }
}

async function syncCloudScore() {
  try {
    await sb.from('players').upsert({
      id: userId, name: userName, power: score, level: 1, gold: score, updated_at: new Date()
    });
  } catch(e){}
}

// Загрузка топа
async function loadTop() {
  let { data } = await sb.from('players').select('*').order('power', { ascending: false }).limit(10);
  document.getElementById('top-list').innerHTML = data && data.length ? data.map((p, i) => `
    <div class="top-row">
      <div>#${i+1} ${p.name}</div>
      <div style="color:var(--primary);">🪙 ${Number(p.power).toLocaleString()}</div>
    </div>
  `).join('') : 'Пока нет игроков в топе';
}

// Чат
async function loadChat() {
  let { data } = await sb.from('chat').select('*').order('id', { ascending: false }).limit(20);
  if (data) {
    document.getElementById('chat-box').innerHTML = data.reverse().map(m => `
      <div class="chat-msg"><b>${m.sender_name}:</b> ${m.message}</div>
    `).join('');
    let box = document.getElementById('chat-box'); box.scrollTop = box.scrollHeight;
  }
}

async function sendMessage() {
  let inp = document.getElementById('chat-input');
  if (!inp || !inp.value.trim()) return;
  let msg = inp.value; inp.value = '';
  await sb.from('chat').insert({ sender_name: userName, message: msg });
  loadChat();
}

function switchTab(id, btn) {
  ['tap', 'top', 'chat'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
  document.getElementById('tab-' + id).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (id === 'top') loadTop();
  if (id === 'chat') loadChat();
}

// Первичная синхронизация при старте
syncCloudScore();
</script>
</body>
</html>
