<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МирЧат Онлайн</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --gold-color: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
        
        /* Боковая панель */
        .sidebar { width: 280px; background: var(--panel-color); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h2 { color: var(--accent-color); font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        .user-preview { margin-top: 15px; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .user-info { overflow: hidden; }
        .user-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-coins { font-size: 0.75rem; color: var(--text-muted); }

        .nav-menu { padding: 15px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(99, 102, 241, 0.1); color: var(--text-main); }
        .nav-btn.active { background: var(--accent-color); color: var(--text-main); }

        /* Основной контент */
        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); overflow: hidden; }
        
        .header { padding: 15px 20px; background: var(--panel-color); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header h3 { font-size: 1.1rem; }
        
        .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message-card { background: var(--panel-color); padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .message-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .message-sender-wrap { display: flex; align-items: center; gap: 5px; }
        .clan-tag { color: var(--accent-color); font-weight: bold; }
        .sender-name { color: var(--text-main); font-weight: 600; }
        .message-text { font-size: 0.95rem; word-break: break-word; line-height: 1.4; }

        .chat-input-area { padding: 15px 20px; background: var(--panel-color); border-top: 1px solid var(--border-color); display: flex; gap: 10px; flex-shrink: 0; }
        
        input, select, button { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 15px; border-radius: 8px; outline: none; font-size: 0.9rem; }
        input:focus { border-color: var(--accent-color); }
        button { background: var(--accent-color); border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }

        /* Разделы */
        .section-view { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .card-box { background: var(--panel-color); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .card-box h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--accent-color); }
        
        .gift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .gift-item { background: var(--panel-color); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .gift-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .gift-price { font-weight: bold; color: var(--gold-color); margin: 8px 0; }

        .clan-list-container { display: flex; flex-direction: column; gap: 10px; }
        .clan-item { background: var(--panel-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        
        .badge-tag { background: rgba(99, 102, 241, 0.15); color: var(--accent-color); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🌍 МирЧат Онлайн</h2>
            <div class="user-preview">
                <div class="avatar" id="my-avatar">👑</div>
                <div class="user-info">
                    <div class="user-name" id="my-name">Игрок</div>
                    <div class="user-coins">Монет: <span id="my-coins">1500</span> 🪙</div>
                </div>
            </div>
        </div>

        <div class="nav-menu">
            <button class="nav-btn active" id="btn-tab-world" onclick="switchTab('world')">💬 Всемирный чат</button>
            <button class="nav-btn" id="btn-tab-clan" onclick="switchTab('clan')">🛡️ Клановый чат</button>
            <button class="nav-btn" id="btn-tab-clans-hub" onclick="switchTab('clans-hub')">🏰 Управление кланами</button>
            <button class="nav-btn" id="btn-tab-gifts" onclick="switchTab('gifts')">🎁 Магазин подарков</button>
        </div>
    </div>

    <!-- Основная рабочая область -->
    <div class="main-content">
        <!-- Шапка -->
        <div class="header">
            <h3 id="current-section-title">Всемирный чат</h3>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="clan-status-badge" class="badge-tag">Клантэг: [Нет]</span>
                <button onclick="switchTab('gifts')" style="padding: 6px 12px; font-size: 0.85rem;">🎁 Подарить</button>
            </div>
        </div>

        <!-- Раздел чатов (Всемирный / Клановый) -->
        <div id="section-chat" class="chat-container">
            <div class="chat-messages" id="messages-list">
                <!-- Динамические сообщения -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Введите сообщение..." style="flex: 1;" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>

        <!-- Раздел управления кланами -->
        <div id="section-clans-hub" class="section-view" style="display: none;">
            <div class="card-box">
                <h3>🛡️ Ваш клан</h3>
                <div id="my-clan-info">
                    <!-- Заполняется JS -->
                </div>
            </div>
            <div class="card-box">
                <h3>📋 Список всех кланов</h3>
                <div class="clan-list-container" id="clans-list">
                    <!-- Список кланов -->
                </div>
            </div>
        </div>

        <!-- Раздел магазина подарков -->
        <div id="section-gifts" class="section-view" style="display: none;">
            <div>
                <h3>🎁 Премиум каталог подарков</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Отправляйте подарки в чат, чтобы порадовать участников и украсить общую ленту.</p>
            </div>
            <div class="gift-grid" id="gift-store-grid">
                <!-- Карточки подарков -->
            </div>
        </div>
    </div>

    <script>
        // Состояние пользователя
        let state = {
            username: "Игрок_" + Math.floor(Math.random() * 900 + 100),
            coins: 1500,
            clanId: null,
            activeTab: 'world'
        };

        // Каталог подарков
        const giftStore = [
            { id: 1, name: "🌟 Звезда", price: 100, icon: "🌟", desc: "Яркий знак внимания" },
            { id: 2, name: "🏆 Кубок", price: 300, icon: "🏆", desc: "Символ победы и успеха" },
            { id: 3, name: "👑 Корона", price: 750, icon: "👑", desc: "Для истинных лидеров чата" },
            { id: 4, name: "🚀 Ракета", price: 1500, icon: "🚀", desc: "Эпический буст к настроению" }
        ];

        // Список кланов
        let clans = [
            { id: 1, name: "Cyber Dragons", tag: "DRGN", treasury: 2500, level: 2, members: 3 },
            { id: 2, name: "Phoenix Legion", tag: "PHNX", treasury: 1200, level: 1, members: 1 }
        ];

        // История сообщений
        let messages = [
            { id: 1, type: 'world', sender: "Система", text: "Добро пожаловать в МирЧат Онлайн! Общайтесь, создавайте кланы, вносите пожертвования и дарите подарки.", time: "12:00", badge: "[Admin]" }
        ];

        // Инициализация
        window.onload = function() {
            document.getElementById('my-name').innerText = state.username;
            updateUI();
            renderMessages();
            renderGiftStore();
            renderClansList();
            renderMyClanInfo();
        };

        // Обновление интерфейса (монеты, теги)
        function updateUI() {
            document.getElementById('my-coins').innerText = state.coins;
            const badge = document.getElementById('clan-status-badge');
            if (state.clanId) {
                const clan = clans.find(c => c.id === state.clanId);
                badge.innerText = `[${clan ? clan.tag : 'CLAN'}]`;
                badge.style.display = 'inline-block';
            } else {
                badge.innerText = "Клантэг: [Нет]";
            }
        }

        // Переключение вкладок
        function switchTab(tabName) {
            state.activeTab = tabName;
            
            // Скрыть все экраны
            document.getElementById('section-chat').style.display = 'none';
            document.getElementById('section-clans-hub').style.display = 'none';
            document.getElementById('section-gifts').style.display = 'none';

            // Сбросить активный класс кнопок меню
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-tab-' + tabName);
            if (activeBtn) activeBtn.classList.add('active');

            // Заголовки
            const titles = {
                'world': 'Всемирный чат',
                'clan': 'Клановый чат',
                'clans-hub': 'Управление кланами',
                'gifts': 'Магазин подарков'
            };
            document.getElementById('current-section-title').innerText = titles[tabName];

            // Показать нужный раздел
            if (tabName === 'world' || tabName === 'clan') {
                document.getElementById('section-chat').style.display = 'flex';
                renderMessages();
            } else if (tabName === 'clans-hub') {
                document.getElementById('section-clans-hub').style.display = 'flex';
                renderClansList();
                renderMyClanInfo();
            } else if (tabName === 'gifts') {
                document.getElementById('section-gifts').style.display = 'flex';
            }
        }

        // Отправка текстового сообщения
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            if (state.activeTab === 'clan' && !state.clanId) {
                alert('Вы не состоите в клане! Сначала вступите в клан в разделе «Управление кланами».');
                return;
            }

            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messages.push({
                id: Date.now(),
                type: state.activeTab,
                sender: state.username,
                text: text,
                time: timeNow,
                badge: state.clanId ? `[${getClanTag(state.clanId)}]` : ''
            });

            // Награда за активность (+5 монет)
            state.coins += 5;
            updateUI();

            input.value = '';
            renderMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Рендер ленты сообщений
        function renderMessages() {
            const list = document.getElementById('messages-list');
            list.innerHTML = '';

            const filtered = messages.filter(m => m.type === state.activeTab);

            if (filtered.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 40px;">Здесь пока нет сообщений. Напишите первыми!</div>`;
                return;
            }

            filtered.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message-card';
                div.innerHTML = `
                    <div class="message-header">
                        <div class="message-sender-wrap">
                            <span class="clan-tag">${msg.badge || ''}</span>
                            <span class="sender-name">${msg.sender}</span>
                        </div>
                        <span>${msg.time}</span>
                    </div>
                    <div class="message-text">${msg.text}</div>
                `;
                list.appendChild(div);
            });
            list.scrollTop = list.scrollHeight;
        }

        // Магазин подарков
        function renderGiftStore() {
            const grid = document.getElementById('gift-store-grid');
            grid.innerHTML = '';
            giftStore.forEach(gift => {
                const card = document.createElement('div');
                card.className = 'gift-item';
                card.innerHTML = `
                    <div>
                        <div class="gift-icon">${gift.icon}</div>
                        <h4 style="font-size: 1rem; margin-bottom: 5px;">${gift.name}</h4>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">${gift.desc}</p>
                    </div>
                    <div>
                        <div class="gift-price">${gift.price} 🪙</div>
                        <button onclick="buyGift(${gift.id})" style="width: 100%; padding: 8px;">Подарить</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function buyGift(giftId) {
            const gift = giftStore.find(g => g.id === giftId);
            if (state.coins < gift.price) {
                alert('Недостаточно монет! Общайтесь в чатах, чтобы заработать.');
                return;
            }
            state.coins -= gift.price;
            updateUI();

            // Трансляция подарка в текущий чат
            messages.push({
                id: Date.now(),
                type: state.activeTab,
                sender: "🎁 Подарок от " + state.username,
                text: `Отправил великолепный подарок ${gift.icon} <b>${gift.name}</b> в эфир!`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                badge: state.clanId ? `[${getClanTag(state.clanId)}]` : ''
            });
            
            switchTab(state.activeTab);
            alert(`Вы успешно отправили ${gift.name}!`);
        }

        // Логика кланов
        function getClanTag(id) {
            const clan = clans.find(c => c.id === id);
            return clan ? clan.tag : '';
        }

        function renderClansList() {
            const list = document.getElementById('clans-list');
            list.innerHTML = '';
            clans.forEach(clan => {
                const isMyClan = state.clanId === clan.id;
                const div = document.createElement('div');
                div.className = 'clan-item';
                div.innerHTML = `
                    <div>
                        <h4 style="color: var(--accent-color);">[${clan.tag}] ${clan.name} <span style="font-size: 0.8rem; color: var(--text-muted);">(Уровень ${clan.level})</span></h4>
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 3px;">Казна: ${clan.treasury} 🪙 | Участников: ${clan.members}</p>
                    </div>
                    ${isMyClan ? '<span style="color: var(--success-color); font-weight: bold;">Ваш клан</span>' : `<button onclick="joinClan(${clan.id})" style="padding: 6px 12px; font-size: 0.85rem;">Вступить</button>`}
                `;
                list.appendChild(div);
            });
        }

        function renderMyClanInfo() {
            const container = document.getElementById('my-clan-info');
            if (!state.clanId) {
                container.innerHTML = `
                    <p style="color: var(--text-muted); margin-bottom: 15px;">Вы еще не состоите ни в одном клане. Создайте свой собственный или выберите из списка ниже.</p>
                    <button onclick="showCreateClanModal()">Создать клан (500 🪙)</button>
                `;
                return;
            }
            const clan = clans.find(c => c.id === state.clanId);
            container.innerHTML = `
                <h4 style="color: var(--accent-color); font-size: 1.2rem; margin-bottom: 5px;">[${clan.tag}] ${clan.name}</h4>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;">Казна клана: <b style="color: var(--gold-color);">${clan.treasury} 🪙</b> | Уровень: <b>${clan.level}</b></p>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="donateToClan(100)" style="padding: 8px 14px; font-size: 0.85rem;">Внести 100 🪙 в казну</button>
                    <button onclick="leaveClan()" style="background: var(--danger-color); padding: 8px 14px; font-size: 0.85rem;">Покинуть клан</button>
                </div>
            `;
        }

        function showCreateClanModal() {
            const name = prompt("Введите название нового клана:");
            if (!name) return;
            const tag = prompt("Введите тег клана (латиницей, до 4 символов):", "TEAM").toUpperCase();
            if (!tag) return;

            if (state.coins < 500) {
                alert('Для создания клана нужно 500 монет!');
                return;
            }

            state.coins -= 500;
            updateUI();

            const newClan = {
                id: Date.now(),
                name: name,
                tag: tag.substring(0, 4),
                treasury: 100,
                level: 1,
                members: 1
            };
            clans.push(newClan);
            state.clanId = newClan.id;
            
            renderClansList();
            renderMyClanInfo();
            updateUI();
            alert('Клан успешно создан!');
        }

        function joinClan(clanId) {
            // Если уже где-то состоял, уменьшим участников старого
            if (state.clanId) {
                const oldClan = clans.find(c => c.id === state.clanId);
                if (oldClan) oldClan.members = Math.max(1, oldClan.members - 1);
            }

            state.clanId = clanId;
            const clan = clans.find(c => c.id === clanId);
            if (clan) clan.members++;

            renderClansList();
            renderMyClanInfo();
            updateUI();
            alert(`Вы успешно вступили в клан [${clan.tag}] ${clan.name}!`);
        }

        function leaveClan() {
            const clan = clans.find(c => c.id === state.clanId);
            if (clan) {
                clan.members = Math.max(1, clan.members - 1);
            }
            state.clanId = null;
            renderClansList();
            renderMyClanInfo();
            updateUI();
            alert('Вы покинули клан.');
        }

        function donateToClan(amount) {
            if (state.coins < amount) {
                alert('У вас недостаточно монет!');
                return;
            }
            state.coins -= amount;
            updateUI();

            const clan = clans.find(c => c.id === state.clanId);
            if (clan) {
                clan.treasury += amount;
                // Простая система повышения уровня клана при накоплении казны
                if (clan.treasury >= clan.level * 2000) {
                    clan.level++;
                    alert(`Поздравляем! Ваш клан [${clan.tag}] поднялся до ${clan.level} уровня!`);
                }
            }

            renderMyClanInfo();
            renderClansList();
            alert(`Вы успешно пополнили казну клана на ${amount} 🪙!`);
        }
    </script>
</body>
</html>
