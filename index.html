<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Охотник за Тенями — Система Пробуждения</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #060913; --panel: #0d1326; --panel2: #131c38; --border: #233261;
    --cyan: #38bdf8; --blue: #3b82f6; --purple: #a855f7; --gold: #f59e0b;
    --red: #ef4444; --green: #22c55e; --text: #f1f5f9; --muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: radial-gradient(circle at 50% 0%, #111c3d 0%, var(--bg) 70%); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; padding-bottom: 76px; }
  .hidden { display: none !important; }
  @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.35); } 50% { box-shadow: 0 0 28px rgba(56, 189, 248, 0.7); } }
  @keyframes floatHero { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes eyeGlow { 0%, 100% { filter: drop-shadow(0 0 4px #38bdf8); } 50% { filter: drop-shadow(0 0 12px #a855f7); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes dmgPop { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 50% { opacity: 1; transform: translateY(-28px) scale(1.2); } 100% { opacity: 0; transform: translateY(-50px) scale(1); } }
  #splash-screen { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle at center, #0f172a 0%, #03050a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .jinwoo-silhouette { width: 150px; height: 180px; margin-bottom: 18px; animation: floatHero 3.2s ease-in-out infinite; }
  .system-box { background: rgba(13, 19, 38, 0.92); border: 1.5px solid var(--cyan); border-radius: 14px; padding: 22px 18px; max-width: 360px; width: 100%; animation: pulseGlow 2.5s infinite; }
  .system-title { color: var(--cyan); font-weight: 800; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 8px; }
  .btn-system { background: linear-gradient(135deg, #0284c7, #6d28d9); color: #fff; border: 1px solid var(--cyan); padding: 13px 22px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 14px; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4); }
  #select-screen { padding: 16px; max-width: 600px; margin: 0 auto; }
  .class-section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .class-header { font-size: 15px; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .avatars-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .avatar-card { background: var(--panel2); border: 1.5px solid #1e293b; border-radius: 10px; padding: 6px 4px; text-align: center; cursor: pointer; }
  .avatar-card.selected { border-color: var(--cyan); background: rgba(56, 189, 248, 0.14); box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
  .avatar-card span { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; }
  .nick-input { width: 100%; padding: 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--cyan); color: #fff; font-size: 15px; margin-bottom: 10px; outline: none; }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(6, 9, 19, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
  .player-badge { display: flex; align-items: center; gap: 10px; }
  .mini-avatar { width: 40px; height: 40px; border-radius: 10px; background: var(--panel2); border: 1.5px solid var(--cyan); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .stats-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pill { background: var(--panel2); border: 1px solid var(--border); padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; }
  .online-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 4px; box-shadow: 0 0 6px var(--green); }
  .container { padding: 14px; max-width: 600px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .equip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot-box { background: var(--panel2); border: 1.5px solid #263354; border-radius: 10px; padding: 8px; text-align: center; position: relative; cursor: pointer; }
  .grade-badge { position: absolute; top: 4px; left: 5px; font-size: 10px; font-weight: 900; padding: 1px 5px; border-radius: 4px; }
  .g-E { color: #9ca3af; border-color: #4b5563; }
  .g-D { color: #60a5fa; border-color: #2563eb; }
  .g-C { color: #38bdf8; border-color: #0284c7; }
  .g-B { color: #a855f7; border-color: #7e22ce; }
  .g-A { color: #c084fc; border-color: #9333ea; }
  .g-S { color: #38bdf8; border-color: #38bdf8; }
  .g-SS { color: #e879f9; border-color: #d946ef; }
  .g-SSS { color: #fde047; border-color: #f59e0b; background: rgba(245,158,11,0.2); }
  .dungeon-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .dng-btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; text-align: left; cursor: pointer; }
  .dng-btn.active { border-color: var(--cyan); background: rgba(56,189,248,0.15); }
  .arena { background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #090d1a 100%); border: 1.5px solid #312e81; border-radius: 14px; padding: 18px 14px; text-align: center; position: relative; overflow: hidden; }
  .monster-sprite { font-size: 64px; display: inline-block; margin: 8px 0; filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.7)); }
  .monster-hit { animation: shake 0.25s; filter: brightness(2) drop-shadow(0 0 20px #ef4444); }
  .hp-bar-wrap { width: 100%; height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden; margin: 8px 0; border: 1px solid #334155; }
  .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #f97316); transition: width 0.2s; }
  .skills-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .skill-btn { background: var(--panel2); border: 1px solid var(--purple); color: #fff; padding: 10px 6px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .dmg-float { position: absolute; left: 50%; top: 38%; font-weight: 900; font-size: 20px; color: #fde047; text-shadow: 0 2px 8px #000; pointer-events: none; animation: dmgPop 0.75s forwards; }
  .item-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel2); border: 1px solid var(--border); padding: 10px; border-radius: 10px; margin-bottom: 8px; }
  .btn-sm { background: var(--blue); color: #fff; border: none; padding: 6px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-gold { background: var(--gold); color: #000; }
  .chat-box { height: 280px; overflow-y: auto; background: #070b17; border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
  .chat-msg { font-size: 13px; line-height: 1.4; }
  .chat-sys { color: var(--gold); font-style: italic; background: rgba(245,158,11,0.1); padding: 4px 8px; border-radius: 6px; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(13, 19, 38, 0.96); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px; }
  .nav-btn { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 3px; cursor: pointer; padding: 4px 0; }
  .nav-btn.active { color: var(--cyan); font-weight: 700; }
  .nav-icon { font-size: 18px; }
</style>
</head>
<body>
    <div id="splash-screen">
  <svg class="jinwoo-silhouette" viewBox="0 0 200 240">
    <defs>
      <radialGradient id="shadowAura" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
        <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="100" cy="120" r="95" fill="url(#shadowAura)"/>
    <path d="M55,85 Q30,150 20,225 L75,210 L100,230 L125,210 L180,225 Q170,150 145,85 Z" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M75,55 Q100,25 125,55 Q132,75 120,88 L80,88 Q68,75 75,55 Z" fill="#05070c"/>
    <ellipse cx="90" cy="66" rx="5" ry="2.5" fill="#38bdf8" style="animation: eyeGlow 1.8s infinite;"/>
    <ellipse cx="110" cy="66" rx="5" ry="2.5" fill="#38bdf8" style="animation: eyeGlow 1.8s infinite;"/>
  </svg>
  <div class="system-box">
    <div class="system-title">[ УВЕДОМЛЕНИЕ СИСТЕМЫ ]</div>

</div>

<div id="select-screen" class="hidden">
  <h2 style="text-align:center; color:var(--cyan); margin:10px 0 4px;">ВЫБОР СОСУДА ДУШИ</h2>

</div>

<div id="game-ui" class="hidden">
  <div class="topbar">
    <div class="player-badge">
      <div class="mini-avatar" id="top-avatar"></div>
      <div>
        <div style="font-weight:800; font-size:14px;" id="top-name">Охотник</div>
        <div style="font-size:11px; color:var(--cyan);" id="top-class">Ур. 1 • Ранг E</div>
      </div>
    </div>
    <div class="stats-pills">
      <div class="pill" style="color:var(--gold);">💰 <span id="top-gold">500</span></div>
      <div class="pill" style="color:#f472b6;">⚔️ <span id="top-power">100</span></div>
    </div>

  <div class="container">
    <div id="tab-dungeon">
      <div class="dungeon-list" id="dungeon-buttons"></div>
      <div class="arena">
        <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted);">
          <span id="dng-rank-label">Врата E-Ранга</span>
          <span>Волна: <b id="wave-num" style="color:#fff;">1</b></span>

        <div class="skills-row">
          <button class="skill-btn" onclick="useSkill('dash')">⚡ Рывок</button>
          <button class="skill-btn" onclick="useSkill('blood')">🩸 Жажда</button>
          <button class="skill-btn" onclick="useSkill('arise')">👥 Восстаньте</button>

        <button class="btn-sm" id="auto-btn" onclick="toggleAutoBattle()" style="width:100%; margin-top:10px; background:#1e293b; border:1px solid var(--cyan);">🤖 Авто-бой: ВЫКЛ</button>
      </div>
      <div class="card" style="margin-top:12px; font-size:12px; color:var(--muted);" id="battle-log">Система активна.</div>
    </div>

        <div class="equip-grid" id="equip-grid" style="margin-top:10px;"></div>
      </div>
      <div class="card">
        <b>Осколки Теней: <span id="shards-count" style="color:var(--purple);">0</span> 🔮</b>

      </div>

    <div id="tab-inv" class="hidden">
      <div class="card">
        <b style="color:var(--cyan);">РЮКЗАК (<span id="inv-count">0</span>)</b>
        <div id="inventory-list" style="margin-top:10px;"></div>
      </div>
    </div>

    <div id="tab-market" class="hidden">
      <div class="card">
        <b style="color:var(--gold);">⚖️ АУКЦИОН</b>
        <button class="btn-sm" style="float:right;" onclick="loadMarket()">🔄</button>
        <div id="market-list" style="margin-top:10px;">Загрузка...</div>
      </div>
    </div>

    <div id="tab-social" class="hidden">
      <div class="card">
        <b style="color:var(--cyan);">🏆 ТОП</b>
        <div id="leaderboard-list" style="margin-top:8px;">Загрузка...</div>
      </div>
      <div class="card">
        <b style="color:var(--purple);">💬 ЧАТ ГИЛЬДИИ</b>
        <div class="chat-box" id="chat-box" style="margin-top:8px;"></div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="chat-input" class="nick-input" style="margin:0; padding:9px;" placeholder="Сообщение...">
          <button class="btn-sm" onclick="sendChat()">➤</button>
        </div>
      </div>
    </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('dungeon', this)"><span class="nav-icon">⚔️</span>Врата</button>
    <button class="nav-btn" onclick="switchTab('hero', this)"><span class="nav-icon">🛡️</span>Снаряжение</button>
    <button class="nav-btn" onclick="switchTab('inv', this)"><span class="nav-icon">🎒</span>Рюкзак</button>
    <button class="nav-btn" onclick="switchTab('market', this)"><span class="nav-icon">⚖️</span>Рынок</button>
    <button class="nav-btn" onclick="switchTab('social', this)"><span class="nav-icon">🏆</span>Топ/Чат</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://optytvvqevlzmzqlcgah.supabase.co";
const SUPABASE_KEY = "sb_publishable_NrlPlzEcCy0SM9G5MXHvXQ_XDvs2RJM";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }

const CLASSES = [
  { id: 'lich', name: 'Король-Лич', icon: '💀', color: '#a855f7' },
  { id: 'returner', name: 'Возвращающийся', icon: '⏳', color: '#38bdf8' },
  { id: 'dragon', name: 'Дракон', icon: '🐉', color: '#ef4444' }
];
const VARIANTS = ['Мужчина 1', 'Мужчина 2', 'Женщина 1', 'Женщина 2'];
const SLOTS = [
  { id: 'weapon', name: 'Оружие', icon: '🗡️' }, { id: 'helm', name: 'Шлем', icon: '🪖' },
  { id: 'armor', name: 'Туловище', icon: '🦺' }, { id: 'pants', name: 'Штаны', icon: '👖' },
  { id: 'boots', name: 'Ботинки', icon: '👢' }, { id: 'gloves', name: 'Перчатки', icon: '🧤' },
  { id: 'neck', name: 'Ожерелье', icon: '📿' }, { id: 'ear', name: 'Серьга', icon: '💠' },
  { id: 'ring', name: 'Кольцо', icon: '💍' }
];
const GRADES = ['E', 'D', 'C', 'B', 'A', 'S', 'SS', 'SSS'];
const GRADE_MULT = { E: 1, D: 1.8, C: 3.2, B: 6, A: 11, S: 22, SS: 45, SSS: 95 };
const DUNGEONS = [
  { rank: 'E', name: 'Врата E', reqPower: 0, hp: 100, gold: 45, exp: 25, monsters: ['🐺 Ликан', '👺 Гоблин'] },
  { rank: 'D', name: 'Врата D', reqPower: 250, hp: 450, gold: 130, exp: 70, monsters: ['🧟 Зомби', '🗿 Голем'] },
  { rank: 'C', name: 'Врата C', reqPower: 800, hp: 1600, gold: 380, exp: 190, monsters: ['🐍 Василиск', '🧌 Огр'] },
  { rank: 'B', name: 'Врата B', reqPower: 2500, hp: 5500, gold: 1100, exp: 520, monsters: ['❄️ Эльф', '⚔️ Рыцарь'] },
  { rank: 'A', name: 'Врата A', reqPower: 8000, hp: 19000, gold: 3400, exp: 1500, monsters: ['👹 Орк', '🔥 Ифрит'] },
  { rank: 'S', name: 'Врата S', reqPower: 25000, hp: 75000, gold: 12000, exp: 5000, monsters: ['🐜 Беру', '🐉 Камиш'] }
];

let state = {
  id: tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : ('guest_' + Math.floor(Math.random()*900000)),
  name: tg?.initDataUnsafe?.user?.first_name || '',
  classId: 'lich', avatarIdx: 0, level: 1, exp: 0, gold: 500, shards: 5,
  equip: {
    weapon: { grade: 'E', name: 'Ржавый клинок', power: 15 }, helm: { grade: 'E', name: 'Капюшон', power: 10 },
    armor: { grade: 'E', name: 'Нагрудник', power: 15 }, pants: { grade: 'E', name: 'Поножи', power: 10 },
    boots: { grade: 'E', name: 'Сапоги', power: 10 }, gloves: { grade: 'E', name: 'Перчатки', power: 10 },
    neck: { grade: 'E', name: 'Амулет', power: 10 }, ear: { grade: 'E', name: 'Серьга', power: 10 },
    ring: { grade: 'E', name: 'Кольцо', power: 10 }
  },
  inventory: []
};

let currentDng = 0, wave = 1, monsterMaxHp = 100, monsterHp = 100, autoBattle = false;

function getAvatarSVG(classId, idx) {
  return `<svg viewBox="0 0 80 80" width="100%" height="100%"><rect width="80" height="80" rx="8" fill="#090e1d"/><circle cx="40" cy="40" r="32" fill="#3b82f6" opacity="0.4"/><path d="M22,75 Q40,52 58,75 Z" fill="#111827"/><circle cx="40" cy="36" r="14" fill="#1f2937"/><circle cx="35" cy="36" r="2" fill="#38bdf8"/><circle cx="45" cy="36" r="2" fill="#38bdf8"/></svg>`;
}

function init() {
  const saved = localStorage.getItem('shadow_hunter_save_v2');
  if (saved) { try { state = { ...state, ...JSON.parse(saved) }; document.getElementById('splash-screen').classList.add('hidden'); startGameUI(); return; } catch(e) {} }
  renderCharacterSelect();
}
function enterCharacterSelect() { document.getElementById('splash-screen').classList.add('hidden'); document.getElementById('select-screen').classList.remove('hidden'); }
function renderCharacterSelect() {
  document.getElementById('classes-container').innerHTML = CLASSES.map(cls => `
    <div class="class-section"><div class="class-header" style="color:${cls.color}">${cls.icon}${cls.name}</div>
    <div class="avatars-grid">${VARIANTS.map((v, i) => `<div class="avatar-card ${state.classId===cls.id && state.avatarIdx===i ? 'selected' : ''}" onclick="pickAvatar('${cls.id}', ${i})"><div style="height:48px;">${getAvatarSVG(cls.id, i)}</div><span>${v}</span></div>`).join('')}</div></div>
  `).join('');
}
function pickAvatar(clsId, idx) { state.classId = clsId; state.avatarIdx = idx; renderCharacterSelect(); }
function confirmCharacter() {
  const nick = document.getElementById('player-nick').value.trim();
  state.name = nick || ('Охотник #' + Math.floor(Math.random()*999));
  localStorage.setItem('shadow_hunter_save_v2', JSON.stringify(state));
  document.getElementById('select-screen').classList.add('hidden');
  startGameUI();
}
function calcTotalPower() {
  let sum = state.level * 25;
  for (let k in state.equip) sum += state.equip[k].power;
  return sum;
}
function getHunterRank() {
  const p = calcTotalPower();
  if (p >= 50000) return 'SSS'; if (p >= 25000) return 'SS'; if (p >= 10000) return 'S';
  if (p >= 4000) return 'A'; if (p >= 1500) return 'B'; if (p >= 600) return 'C'; if (p >= 250) return 'D'; return 'E';
}
function saveState() { localStorage.setItem('shadow_hunter_save_v2', JSON.stringify(state)); updateTopBar(); }
function updateTopBar() {
  document.getElementById('top-avatar').innerHTML = getAvatarSVG(state.classId, state.avatarIdx);
  document.getElementById('top-name').textContent = state.name;
  document.getElementById('top-class').textContent = `Ур. ${state.level} • Ранг ${getHunterRank()}`;
  document.getElementById('top-gold').textContent = state.gold.toLocaleString();
  document.getElementById('top-power').textContent = calcTotalPower().toLocaleString();
  document.getElementById('shards-count').textContent = state.shards;
  document.getElementById('inv-count').textContent = state.inventory.length;
}
function startGameUI() {
  document.getElementById('game-ui').classList.remove('hidden');
  updateTopBar(); renderDungeons(); spawnMonster(); renderEquipGrid(); renderInventory();
  syncPlayerToSupabase(); loadLeaderboard(); loadMarket(); loadChat();

}
