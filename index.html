<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Hunter: Awakening</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #030712; --card: #0f172a; --border: #1e293b;
    --neon-blue: #06b6d4; --neon-purple: #8b5cf6; --gold: #fbbf24; --red: #f43f5e; --text: #f8fafc; --muted: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; padding-bottom: 75px; overflow-x: hidden;
  }
  .hidden { display: none !important; }
  
  /* Верхняя панель */
  .header {
    background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); padding: 10px 16px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 50;
  }
  .stat-badge { background: #1e293b; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); }

  .container { padding: 16px; max-width: 500px; margin: 0 auto; }
  
  /* Карточки */
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  }

  /* Арена */
  .arena { text-align: center; position: relative; }
  .boss-avatar {
    font-size: 80px; margin: 15px 0; display: inline-block;
    filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.6));
    transition: transform 0.1s;
  }
  .boss-hit { transform: scale(0.9) rotate(-5deg); filter: brightness(2) drop-shadow(0 0 20px var(--red)); }
  
  .progress-bg { width: 100%; height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden; margin: 12px 0; border: 1px solid #334155; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); width: 100%; transition: width 0.1s; }

  /* Кнопки */
  .btn {
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    color: white; border: none; padding: 14px; border-radius: 12px;
    font-weight: 800; font-size: 15px; width: 100%; cursor: pointer;
    box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }

  /* Лут и сетка */
  .item-card {
    background: #1e293b; border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 13px;
  }
  .rarity-S { border-color: var(--gold); color: var(--gold); }
  .rarity-A { border-color: var(--neon-purple); color: var(--neon-purple); }
  
  /* Навигация */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a;
    border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 8px; z-index: 100;
  }
  .nav-item {
    background: none; border: none; color: var(--muted);
    font-size: 11px; font-weight: 700; display: flex; flex-direction: column;
    align-items: center; gap: 4px; cursor: pointer; padding: 6px;
  }
  .nav-item.active { color: var(--neon-blue); }
  
  .floating-dmg {
    position: absolute; left: 50%; top: 30%; font-weight: 900; font-size: 22px;
    color: var(--gold); pointer-events: none; animation: floatUp 0.6s forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
    100% { opacity: 0; transform: translate(-50%, -40px) scale(1.2); }
  }
</style>
</head>
<body>

<div class="header">
  <div><b id="player-name">Хантер</b> <span style="font-size:11px; color:var(--neon-blue);" id="player-lvl">Ур. 1</span></div>
  <div style="display:flex; gap:8px;">
    <span class="stat-badge">⚡ <span id="stat-atk">15</span></span>
    <span class="stat-badge" style="color:var(--gold);">🪙 <span id="stat-gold">100</span></span>
  </div>
</div>

<div class="container">
  <!-- ВКЛАДКА 1: БОЙ -->
  <div id="tab-fight" class="panel arena">
    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted);">
      <span>Сектор: <b id="sector-name" style="color:#fff;">Альфа-1</b></span>
      <span>Волна: <b id="wave-count" style="color:var(--neon-blue);">1</b>/10</span>
    </div>
    
    <div id="boss-icon" class="boss-avatar">👾</div>
    <h3 id="boss-name" style="margin: 0 0 5px 0;">Кибер-Зомби</h3>
    
    <div class="progress-bg">
      <div id="boss-hp-bar" class="progress-fill"></div>
    </div>
    <div style="font-size: 11px; color: var(--muted); margin-bottom: 15px;">HP: <span id="boss-hp-text">100/100</span></div>

    <button class="btn" onclick="hitBoss()">АТАКОВАТЬ СЕТЬ</button>
  </div>

  <!-- ВКЛАДКА 2: ИВЕНТЫ И ЛУТ -->
  <div id="tab-inventory" class="panel hidden">
    <h3 style="margin-top:0; color:var(--neon-blue); font-size:16px;">ИНВЕНТАРЬ И БУСТЫ</h3>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; background:#1e293b; padding:10px; border-radius:10px;">
      <div>
        <div style="font-weight:700; font-size:13px;">Квантовый контейнер</div>
        <div style="font-size:11px; color:var(--muted);">Шанс найти редкий кибер-модуль</div>
      </div>
      <button class="btn btn-gold" style="width:auto; padding:8px 14px; font-size:12px;" onclick="openBox()">Открыть (50🪙)</button>
    </div>
    <div id="inventory-list"><div style="color:var(--muted); font-size:13px; text-align:center; padding:20px;">Инвентарь пуст</div></div>
  </div>

  <!-- ВКЛАДКА 3: ПРОКАЧКА -->
  <div id="tab-upgrades" class="panel hidden">
    <h3 style="margin-top:0; color:var(--neon-purple); font-size:16px;">МОДУЛИ УСИЛЕНИЯ</h3>
    <div class="item-row" style="background:#1e293b; border-radius:12px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <b>Нейро-клинок v1</b>
        <div style="font-size:11px; color:var(--muted);">Урон за клик: +10</div>
      </div>
      <button class="btn" style="width:auto; padding:8px 14px; font-size:12px;" onclick="upgradeAtk()">Улучшить (<span id="up-cost">75</span>🪙)</button>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-item active" onclick="switchTab('fight', this)"><span>⚔️</span>Битва</button>
  <button class="nav-item" onclick="switchTab('inventory', this)"><span>📦</span>Лут</button>
  <button class="nav-item" onclick="switchTab('upgrades', this)"><span>⚡</span>Прокачка</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }

let game = {
  name: tg?.initDataUnsafe?.user?.first_name || 'Охотник',
  lvl: 1, gold: 150, atk: 15,
  wave: 1, sector: 1,
  inventory: []
};

let bossMaxHp = 100, bossHp = 100;
const bosses = [
  {name: 'Кибер-Зомби', icon: '👾'},
  {name: 'Дрон-Убийца', icon: '🛸'},
  {name: 'ИИ-Мутант', icon: '🤖'},
  {name: 'Кибер-Дракон', icon: '🐉'}
];

function updateUI() {
  document.getElementById('player-name').textContent = game.name;
  document.getElementById('player-lvl').textContent = 'Ур. ' + game.lvl;
  document.getElementById('stat-atk').textContent = game.atk;
  document.getElementById('stat-gold').textContent = game.gold;
  document.getElementById('wave-count').textContent = game.wave;
  document.getElementById('sector-name').textContent = 'Сектор-' + game.sector;
  document.getElementById('boss-hp-bar').style.width = Math.max(0, (bossHp / bossMaxHp) * 100) + '%';
  document.getElementById('boss-hp-text').textContent = Math.max(0, Math.floor(bossHp)) + '/' + bossMaxHp;
}

function showDmg(txt) {
  const arena = document.querySelector('.arena');
  const el = document.createElement('div');
  el.className = 'floating-dmg'; el.textContent = '-' + txt;
  arena.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

function hitBoss() {
  bossHp -= game.atk;
  showDmg(game.atk);
  
  const avatar = document.getElementById('boss-icon');
  avatar.classList.add('boss-hit');
  setTimeout(() => avatar.classList.remove('boss-hit'), 100);

  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

  if (bossHp <= 0) {
    game.gold += 25 * game.sector;
    game.wave++;
    if (game.wave > 10) {
      game.wave = 1; game.sector++;
      game.lvl++;
      game.atk += 10;
    }
    nextBoss();
  }
  updateUI();
}

function nextBoss() {
  bossMaxHp = 100 + (game.sector * 50) + (game.wave * 15);
  bossHp = bossMaxHp;
  const b = bosses[Math.floor(Math.random() * bosses.length)];
  document.getElementById('boss-name').textContent = b.name;
  document.getElementById('boss-icon').textContent = b.icon;
}

function upgradeAtk() {
  let cost = 75 * Math.floor(game.atk / 10);
  if (game.gold < cost) return alert('Недостаточно кредитов!');
  game.gold -= cost;
  game.atk += 12;
  document.getElementById('up-cost').textContent = 75 * Math.floor(game.atk / 10);
  updateUI();
}

function openBox() {
  if (game.gold < 50) return alert('Нужно 50 кредитов!');
  game.gold -= 50;
  const rarities = ['E', 'D', 'C', 'B', 'A', 'S'];
  const r = rarities[Math.floor(Math.random() * rarities.length)];
  const item = { name: `Модуль #${Math.floor(Math.random()*900+100)}`, rarity: r, bonus: r === 'S' ? 50 : 10 };
  game.inventory.push(item);
  renderInv();
  updateUI();
  alert(`Найдено устройство редкости [${r}]!`);
}

function renderInv() {
  const list = document.getElementById('inventory-list');
  if (!game.inventory.length) {
    list.innerHTML = '<div style="color:var(--muted); font-size:13px; text-align:center; padding:20px;">Инвентарь пуст</div>';
    return;
  }
  list.innerHTML = game.inventory.map((it, idx) => `
    <div class="item-card rarity-${it.rarity}">
      <div><b>[${it.rarity}]</b> ${it.name}</div>
      <button class="btn" style="width:auto; padding:4px 8px; font-size:11px;" onclick="sellItem(${idx})")>Продать</button>
    </div>
  `).join('');
}

function sellItem(idx) {
  game.inventory.splice(idx, 1);
  game.gold += 30;
  renderInv();
  updateUI();
}

function switchTab(id, btn) {
  ['fight', 'inventory', 'upgrades'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
  document.getElementById('tab-' + id).classList.remove('hidden');
  document.querySelectorAll('.nav').forEach(n => {}); // reset
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

updateUI();
nextBoss();
</script>
</body>
</html>
