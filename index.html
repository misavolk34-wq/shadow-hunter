<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Охотник за Тенями</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg: #060913; --panel: #0d1326; --panel2: #131c38; --border: #233261; --cyan: #38bdf8; --purple: #a855f7; --gold: #f59e0b; --red: #ef4444; --green: #22c55e; --text: #f1f5f9; --muted: #94a3b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: radial-gradient(circle at 50% 0%, #111c3d 0%, var(--bg) 70%); color: var(--text); font-family: sans-serif; min-height: 100vh; padding-bottom: 70px; }
  .hidden { display: none !important; }
  #splash-screen { position: fixed; inset: 0; z-index: 100; background: #03050a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .system-box { background: rgba(13, 19, 38, 0.95); border: 1.5px solid var(--cyan); border-radius: 14px; padding: 20px; width: 100%; max-width: 340px; box-shadow: 0 0 20px rgba(56,189,248,0.4); }
  .btn-system { background: linear-gradient(135deg, #0284c7, #6d28d9); color: #fff; border: 1px solid var(--cyan); padding: 12px; border-radius: 10px; font-weight: 700; width: 100%; margin-top: 12px; cursor: pointer; }
  .container { padding: 12px; max-width: 600px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .topbar { background: rgba(6, 9, 19, 0.95); border-bottom: 1px solid var(--border); padding: 10px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; }
  .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .slot-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; position: pointer; }
  .g-E { color: #9ca3af; } .g-D { color: #60a5fa; } .g-C { color: #38bdf8; } .g-B { color: #a855f7; } .g-A { color: #c084fc; } .g-S { color: #38bdf8; } .g-SS { color: #e879f9; } .g-SSS { color: #fde047; }
  .arena { background: radial-gradient(circle, #1e1b4b 0%, #090d1a 100%); border: 1px solid #312e81; border-radius: 12px; padding: 16px; text-align: center; }
  .item-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel2); border: 1px solid var(--border); padding: 8px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
  .btn-sm { background: #3b82f6; color: #fff; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; z-index: 50; }
  .nav-btn { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; }
  .nav-btn.active { color: var(--cyan); }
  .nick-input { width: 100%; padding: 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--cyan); color: #fff; margin-bottom: 10px; }
  .chat-box { height: 220px; overflow-y: auto; background: #050811; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="splash-screen">
  <div style="font-size: 60px; margin-bottom: 10px;">👤</div>
  <div class="system-box">
    <div style="color:var(--cyan); font-weight:800; font-size:12px; margin-bottom:8px;">[ СИСТЕМА ПРОБУЖДЕНИЯ ]</div>
    <p style="font-size:13px; margin:0 0 10px;">Принять силу Монарха Теней?</p>
    <button class="btn-system" onclick="enterCharacterSelect()">ПРИНЯТЬ ПРОБУЖДЕНИЕ</button>
  </div>
</div>

<div id="select-screen" class="hidden" style="padding:20px; max-width:400px; margin:auto; text-align:center;">
  <h3 style="color:var(--cyan);">СОЗДАНИЕ ОХОТНИКА</h3>
  <input type="text" id="player-nick" class="nick-input" placeholder="Введите имя..." maxlength="15">
  <button class="btn-system" onclick="confirmCharacter()">НАЧАТЬ ИГРУ</button>
</div>

<div id="game-ui" class="hidden">
  <div class="topbar">
    <div><b id="top-name">Охотник</b><div style="font-size:11px; color:var(--cyan);" id="top-lvl">Ур. 1 • Ранг E</div></div>
    <div>💰 <span id="top-gold">500</span> | ⚔️ <span id="top-power">100</span></div>
  </div>

  <div class="container">
    <div id="tab-dungeon">
      <div class="arena">
        <div style="font-size:12px; color:var(--muted);" id="dng-title">Врата E-Ранга (Волна <span id="wave-num">1</span>)</div>
        <div id="monster-icon" style="font-size:50px; margin:10px 0;">🐺</div>
        <div id="monster-name" style="font-weight:bold;">Ликан</div>
        <div style="background:#1e293b; height:10px; border-radius:5px; margin:8px 0; overflow:hidden;">
          <div id="hp-fill" style="width:100%; height:100%; background:linear-gradient(90deg, red, orange);"></div>
        </div>
        <button class="btn-system" onclick="attackMonster()">АТАКОВАТЬ МОНСТРА</button>
      </div>
    </div>

    <div id="tab-hero" class="hidden">
      <div class="card">
        <b style="color:var(--cyan); font-size:13px;">СНАРЯЖЕНИЕ (E → SSS)</b>
        <div class="slot-grid" id="equip-grid" style="margin-top:8px;"></div>
      </div>
      <div class="card">
        <b>Осколки: <span id="shards-count" style="color:var(--purple);">5</span>🔮</b>
        <button class="btn-sm" style="float:right; background:var(--gold); color:#000;" onclick="openChest()">Сундук (300💰)</button>
      </div>
    </div>

    <div id="tab-inv" class="hidden">
      <div class="card"><b style="color:var(--cyan);">РЮКЗАК</b><div id="inv-list" style="margin-top:8px;"></div></div>
    </div>

    <div id="tab-market" class="hidden">
      <div class="card"><b style="color:var(--gold);">АУКЦИОН</b><button class="btn-sm" style="float:right;" onclick="loadMarket()">🔄</button><div id="market-list" style="margin-top:8px;">Загрузка...</div></div>
    </div>

    <div id="tab-social" class="hidden">
      <div class="card"><b style="color:var(--cyan);">ТОП ИГРОКОВ</b><div id="top-list" style="margin-top:6px; font-size:12px;"></div></div>
      <div class="card"><b style="color:var(--purple);">ЧАТ</b><div class="chat-box" id="chat-box"></div>
        <div style="display:flex; gap:6px;"><input type="text" id="chat-inp" class="nick-input" style="margin:0; padding:6px;" placeholder="Сообщение..."><button class="btn-sm" onclick="sendChat()">➤</button></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('dungeon', this)"><span>⚔️</span>Врата</button>
    <button class="nav-btn" onclick="switchTab('hero', this)"><span>🛡️</span>Экипировка</button>
    <button class="nav-btn" onclick="switchTab('inv', this)"><span>🎒</span>Рюкзак</button>
    <button class="nav-btn" onclick="switchTab('market', this)"><span>⚖️</span>Рынок</button>
    <button class="nav-btn" onclick="switchTab('social', this)"><span>🏆</span>Чат/Топ</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://optytvvqevlzmzqlcgah.supabase.co";
const SUPABASE_KEY = "sb_publishable_NrlPlzEcCy0SM9G5MXHvXQ_XDvs2RJM";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  id: 'user_' + Math.floor(Math.random()*900000),
  name: 'Охотник', level: 1, exp: 0, gold: 500, shards: 5,
  equip: { weapon: {g:'E', n:'Клинок', p:15}, helm: {g:'E', n:'Шлем', p:10}, armor: {g:'E', n:'Броня', p:15} },
  inventory: []
};

let wave = 1, hp = 100, maxHp = 100;

function enterCharacterSelect() {
  document.getElementById('splash-screen').classList.add('hidden');
  document.getElementById('select-screen').classList.remove('hidden');
}

function confirmCharacter() {
  const n = document.getElementById('player-nick').value.trim();
  if (n) state.name = n;
  document.getElementById('select-screen').classList.add('hidden');
  startGame();
}

function startGame() {
  document.getElementById('game-ui').classList.remove('hidden');
  updateUI(); renderEquip(); renderInv();
  syncCloud(); loadMarket(); loadTop(); loadChat();
  setInterval(loadChat, 5000);
}

function totalPower() {
  let p = state.level * 25;
  for (let k in state.equip) p += state.equip[k].p;
  return p;
}

function updateUI() {
  document.getElementById('top-name').textContent = state.name;
  document.getElementById('top-lvl').textContent = `Ур. ${state.level} • Мощь ${totalPower()}`;
  document.getElementById('top-gold').textContent = state.gold;
  document.getElementById('shards-count').textContent = state.shards;
}

function attackMonster() {
  hp -= totalPower();
  if (hp <= 0) {
    state.gold += 50; state.exp += 30;
    if (Math.random() < 0.4) state.inventory.push({ id: Date.now(), slot: 'weapon', g: 'D', n: 'Меч Д', p: 35 });
    if (state.exp >= state.level * 100) { state.exp = 0; state.level++; }
    hp = 100 + wave * 20; wave++;
    document.getElementById('wave-num').textContent = wave;
  }
  document.getElementById('hp-fill').style.width = Math.max(0, (hp / (100 + (wave-1)*20)) * 100) + '%';
  updateUI(); renderInv();
}

function renderEquip() {
  document.getElementById('equip-grid').innerHTML = Object.keys(state.equip).map(k => {
    let it = state.equip[k];
    return `<div class="slot-box g-${it.g}"><b style="font-size:10px;">[${it.g}]</b><div style="font-size:12px;">${it.n}</div><div style="font-size:10px; color:var(--cyan);">+${it.p}</div></div>`;
  }).join('');
}

function renderInv() {
  document.getElementById('inv-list').innerHTML = state.inventory.length ? state.inventory.map((it, i) => `
    <div class="item-row"><div><b class="g-${it.g}">[${it.g}]</b> ${it.n} (+${it.p})</div>
    <button class="btn-sm" onclick="sellItem(${i})">На рынок</button></div>`).join('') : '<div style="color:var(--muted); font-size:12px;">Пусто</div>';
}

function openChest() {
  if (state.gold < 300) return alert('Мало золота!');
  state.gold -= 300;
  state.inventory.push({ id: Date.now(), slot: 'armor', g: 'C', n: 'Доспех С', p: 60 });
  updateUI(); renderInv(); alert('Предмет добавлен в рюкзак!');
}

async function syncCloud() {
  try { await sb.from('players').upsert({ id: state.id, name: state.name, level: state.level, power: totalPower(), gold: state.gold }); } catch(e){}
}

async function sellItem(i) {
  let item = state.inventory.splice(i, 1)[0];
  updateUI(); renderInv();
  await sb.from('market').insert({ seller_id: state.id, seller_name: state.name, slot: item.slot, grade: item.g, item_name: item.n, power: item.p, price: 150 });
  loadMarket(); alert('Выставлено на рынок!');
}

async function loadMarket() {
  let { data } = await sb.from('market').select('*').limit(15);
  document.getElementById('market-list').innerHTML = data && data.length ? data.map(l => `
    <div class="item-row"><div><b>[${l.grade}]</b> ${l.item_name} (${l.price}💰)</div>
    <button class="btn-sm" style="background:var(--gold); color:#000;" onclick="buyLot(${l.id}, ${l.price}, '${l.item_name}', ${l.power})">Купить</button></div>`).join('') : 'Рынок пуст';
}

async function buyLot(id, price, name, p) {
  if (state.gold < price) return alert('Не хватает золота!');
  state.gold -= price; state.inventory.push({ id: Date.now(), slot: 'weapon', g: 'B', n: name, p: p });
  updateUI(); renderInv(); await sb.from('market').delete().eq('id', id); loadMarket();
}

async function loadTop() {
  let { data } = await sb.from('players').select('*').order('power', { ascending: false }).limit(10);
  document.getElementById('top-list').innerHTML = data ? data.map((p, i) => `<div><b>#${i+1}</b> ${p.name} — ⚔️ ${p.power}</div>`).join('') : '';
}

async function loadChat() {
  let { data } = await sb.from('chat').select('*').order('id', { ascending: false }).limit(15);
  if (data) document.getElementById('chat-box').innerHTML = data.reverse().map(m => `<div><b>${m.sender_name}:</b> ${m.message}</div>`).join('');
}

async function sendChat() {
  let inp = document.getElementById('chat-inp');
  if (!inp.value.trim()) return;
  let msg = inp.value; inp.value = '';
  await sb.from('chat').insert({ sender_name: state.name, message: msg });
  loadChat();
}

function switchTab(id, btn) {
  ['dungeon', 'hero', 'inv', 'market', 'social'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
  document.getElementById('tab-' + id).classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (id === 'market') loadMarket();
  if (id === 'social') { loadTop(); loadChat(); }
}
</script>
</body>
</html>
