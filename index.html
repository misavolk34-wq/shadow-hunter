<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МирЧат Онлайн</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
        
        /* Стили контейнеров */
        .sidebar { width: 280px; background: var(--panel-color); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
        
        /* Шапка и панели */
        .header { padding: 15px 20px; background: var(--panel-color); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .chat-input-area { padding: 15px 20px; background: var(--panel-color); border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        
        /* Кнопки и инпуты */
        input, select, button { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 15px; border-radius: 8px; outline: none; }
        button { background: var(--accent-color); border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
        <!-- Боковая панель навигации -->
    <div class="sidebar">
        <div style="padding: 20px; border-bottom: 1px solid var(--border-color);">
            <h2 style="color: var(--accent-color); font-size: 1.2rem;">🌍 МирЧат Онлайн</h2>
            <div id="user-profile-preview" style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                <div style="width: 40px; height: 40px; background: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;" id="my-avatar">👑</div>
                <div>
                    <div id="my-name" style="font-weight: 600; font-size: 0.95rem;">Игрок</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Монет: <span id="my-coins">1000</span> 🪙</div>
                </div>
            </div>
        </div>

        <!-- Переключение вкладок -->
        <div style="padding: 15px; display: flex; flex-direction: column; gap: 8px;">
            <button class="nav-btn active" onclick="switchTab('world')" style="text-align: left;">💬 Всемирный чат</button>
            <button class="nav-btn" onclick="switchTab('clan')" style="text-align: left;">🛡️ Клановый чат</button>
            <button class="nav-btn" onclick="switchTab('clans-hub')" style="text-align: left;">🏰 Управление кланами</button>
            <button class="nav-btn" onclick="switchTab('gifts')" style="text-align: left;">🎁 Магазин подарков</button>
        </div>
    </div>

    <!-- Основная рабочая область -->
    <div class="main-content">
        <!-- Шапка чата / раздела -->
        <div class="header">
            <h3 id="current-section-title">Всемирный чат</h3>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="clan-status-badge" style="font-size: 0.85rem; color: var(--text-muted);">Клантэг: [Нет]</span>
                <button onclick="openGiftModal()" style="padding: 8px 12px; font-size: 0.85rem;">🎁 Подарить</button>
            </div>
        </div>

        <!-- Секция чата (общая для Всемирного и Кланового) -->
        <div id="section-chat" class="chat-container" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <div class="chat-messages" id="messages-list">
                <!-- Сообщения будут добавляться динамически -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Введите сообщение..." style="flex: 1;" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>

        <!-- Секция управления кланами (скрыта по умолчанию) -->
        <div id="section-clans-hub" class="chat-messages" style="display: none; overflow-y: auto;">
            <div style="background: var(--panel-color); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
                <h3>🛡️ Ваш клан</h3>
                <div id="my-clan-info" style="margin-top: 15px;">
                    <p style="color: var(--text-muted);">Вы еще не состоите в клане. Создайте свой или вступите в существующий!</p>
                    <button onclick="showCreateClanModal()" style="margin-top: 10px;">Создать клан (500 🪙)</button>
                </div>
            </div>
            <h3>📋 Список всех кланов</h3>
            <div id="clans-list" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                <!-- Список кланов рендерится через JS -->
            </div>
        </div>

        <!-- Секция магазина подарков (скрыта по умолчанию) -->
        <div id="section-gifts" class="chat-messages" style="display: none; overflow-y: auto;">
            <h3>🎁 Доступные подарки</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Подарите подарок другу или в общий чат, чтобы украсить его профиль и ленту!</p>
            <div id="gift-store-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                <!-- Карточки подарков -->
            </div>
        </div>
    </div>
        <script>
        // Состояние пользователя и приложения
        let state = {
            username: "Игрок_" + Math.floor(Math.random() * 1000),
            coins: 1500,
            xp: 0,
            level: 1,
            clanId: null,
            inventory: [],
            activeTab: 'world'
        };

        // База данных подарков
        const giftStore = [
            { id: 1, name: "🌟 Звезда", price: 100, icon: "🌟", desc: "Яркий знак внимания" },
            { id: 2, name: "🏆 Кубок", price: 300, icon: "🏆", desc: "Символ победы и успеха" },
            { id: 3, name: "👑 Корона", price: 750, icon: "👑", desc: "Для истинных лидеров чата" },
            { id: 4, name: "🚀 Ракета", price: 1500, icon: "🚀", desc: "Эпический буст к настроению" }
        ];

        // Список кланов (демо-данные)
        let clans = [
            { id: 1, name: "Cyber Dragons", tag: "DRGN", treasury: 2500, level: 2, upgrades: { capacity: 1, xpBonus: 1, tax: 0, banner: 0 }, members: 3 },
            { id: 2, name: "Phoenix Legion", tag: "PHNX", treasury: 1200, level: 1, upgrades: { capacity: 0, xpBonus: 0, tax: 0, banner: 0 }, members: 1 }
        ];

        // Массив сообщений
        let messages = [
            { id: 1, type: 'world', sender: "Система", text: "Добро пожаловать в МирЧат Онлайн! Общайтесь, создавайте кланы и дарите подарки.", time: "12:00", badge: "[Admin]" }
        ];

        // Инициализация при загрузке
        window.onload = function() {
            document.getElementById('my-name').innerText = state.username;
            updateUI();
            renderMessages();
            renderGiftStore();
            renderClansList();
        };

        // Обновление интерфейса пользователя
        function updateUI() {
            document.getElementById('my-coins').innerText = state.coins;
        }

        // Переключение вкладок
        function switchTab(tabName) {
            state.activeTab = tabName;
            
            // Скрываем все разделы
            document.getElementById('section-chat').style.display = 'none';
            document.getElementById('section-clans-hub').style.display = 'none';
            document.getElementById('section-gifts').style.display = 'none';

            // Убираем активный класс у кнопок
            document.querySelectorAll('.nav-btn').forEach(btn => btn.style.background = 'transparent');

            const titles = {
                'world': 'Всемирный чат',
                'clan': 'Клановый чат',
                'clans-hub': 'Управление кланами',
                'gifts': 'Магазин подарков'
            };
            document.getElementById('current-section-title').innerText = titles[tabName];

            if (tabName === 'world' || tabName === 'clan') {
                document.getElementById('section-chat').style.display = 'flex';
                renderMessages();
            } else if (tabName === 'clans-hub') {
                document.getElementById('section-clans-hub').style.display = 'block';
                renderClansList();
                renderMyClanInfo();
            } else if (tabName === 'gifts') {
                document.getElementById('section-gifts').style.display = 'block';
            }
        }

        // Отправка сообщения
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            if (state.activeTab === 'clan' && !state.clanId) {
                alert('Вы не состоите в клане! Вступите в клан, чтобы писать в клановый чат.');
                return;
            }

            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messages.push({
                id: Date.now(),
                type: state.activeTab,
                sender: state.username,
                text: text,
                time: timeNow,
                badge: state.clanId ? `[${getClanTag(state.clanId)}]` : ''
            });

            // Награда за активность
            state.coins += 5;
            updateUI();

            input.value = '';
            renderMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Рендер сообщений в чате
        function renderMessages() {
            const list = document.getElementById('messages-list');
            list.innerHTML = '';

            const filtered = messages.filter(m => m.type === state.activeTab);

            filtered.forEach(msg => {
                const div = document.createElement('div');
                div.style.cssText = "background: var(--panel-color); padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border-color);";
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">
                        <div>
                            <span style="color: var(--accent-color); font-weight: bold; margin-right: 5px;">${msg.badge || ''}</span>
                            <span style="color: var(--text-main); font-weight: 600;">${msg.sender}</span>
                        </div>
                        <span>${msg.time}</span>
                    </div>
                    <div style="font-size: 0.95rem; word-break: break-word;">${msg.text}</div>
                `;
                list.appendChild(div);
            });
            list.scrollTop = list.scrollHeight;
        }

        // Рендер магазина подарков
        function renderGiftStore() {
            const grid = document.getElementById('gift-store-grid');
            grid.innerHTML = '';
