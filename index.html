<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МирЧат Онлайн</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-color: #131b2e;
            --panel-glass: rgba(19, 27, 46, 0.88);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --gold-color: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            height: 100vh; 
            height: 100dvh;
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* Шапка */
        .app-header {
            background: var(--panel-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .user-mini-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        .user-mini-profile:active { background: rgba(255, 255, 255, 0.08); }

        .avatar {
            width: 38px;
            height: 38px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }

        .user-details .name {
            font-size: 0.85rem;
            font-weight: 600;
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-details .coins {
            font-size: 0.72rem;
            color: var(--gold-color);
            font-weight: 600;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Контент */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message-card {
            background: var(--panel-glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.75rem;
        }

        .sender-info { display: flex; align-items: center; gap: 6px; }
        .clan-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.7rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .sender-name { font-weight: 600; color: var(--text-main); }
        .message-time { color: var(--text-muted); }
        .message-text { font-size: 0.95rem; line-height: 1.4; word-break: break-word; color: #e2e8f0; }

        .chat-input-area {
            padding: 12px 16px;
            background: var(--panel-glass);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input, select, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .send-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .section-view {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-box {
            background: var(--panel-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .card-box h3 {
            font-size: 1.05rem;
            margin-bottom: 12px;
            color: #818cf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Нижнее меню */
        .bottom-nav {
            background: var(--panel-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 6px env(safe-area-inset-bottom, 8px);
            z-index: 10;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
            transition: all 0.2s;
            flex: 1;
        }

        .nav-item .icon { font-size: 1.3rem; }
        .nav-item.active {
            color: #818cf8;
            background: rgba(99, 102, 241, 0.1);
        }

        .btn-action {
            background: var(--accent-gradient);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            width: 100%;
        }
        .btn-action:active { opacity: 0.85; }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }

        /* Выбор аватарок */
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .avatar-option {
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.8rem;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }
        .avatar-option.selected { border-color: var(--accent-color); background: rgba(99, 102, 241, 0.2); }

        .gift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gift-item {
            background: var(--panel-glass);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .gift-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .gift-price { font-weight: 700; color: var(--gold-color); font-size: 0.9rem; margin: 8px 0; }
        .clan-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="app-header">
        <div class="user-mini-profile" onclick="switchTab('profile')">
            <div class="avatar" id="header-avatar">👑</div>
            <div class="user-details">
                <div class="name" id="header-name">Игрок</div>
                <div class="coins"><span id="my-coins">1500</span> 🪙</div>
            </div>
        </div>
        <div class="header-title" id="current-section-title">Всемирный чат</div>
    </header>

    <!-- Основная область -->
    <div class="main-content">
        
        <!-- Чат -->
        <div id="section-chat" class="chat-container" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
            <div class="chat-messages" id="messages-list"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Написать сообщение..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- Профиль пользователя -->
        <div id="section-profile" class="section-view" style="display: none;">
            <div class="card-box" style="text-align: center;">
                <div id="profile-big-avatar" style="font-size: 3.5rem; margin-bottom: 10px;">👑</div>
                <h3 id="profile-display-name" style="justify-content: center; font-size: 1.2rem;">Игрок</h3>
                <p id="profile-status-text" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">Статус не указан</p>
                <div style="background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.3); padding: 10px; border-radius: 10px; margin-bottom: 15px;">
                    Баланс: <b style="color: var(--gold-color);"><span id="profile-coins">1500</span> 🪙</b>
                </div>
            </div>

            <div class="card-box">
                <h3>⚙️ Настройки профиля</h3>
                <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Ваше имя:</label>
                        <input type="text" id="input-edit-name" style="margin-top: 4px;">
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">О себе (статус):</label>
                        <input type="text" id="input-edit-status" placeholder="Пару слов о себе..." style="margin-top: 4px;">
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Выберите аватарку:</label>
                        <div class="avatar-grid" id="avatar-selector">
                            <div class="avatar-option" onclick="selectAvatar('👑')">👑</div>
                            <div class="avatar-option" onclick="selectAvatar('🐉')">🐉</div>
                            <div class="avatar-option" onclick="selectAvatar('🦊')">🦊</div>
                            <div class="avatar-option" onclick="selectAvatar('⚡')">⚡</div>
                            <div class="avatar-option" onclick="selectAvatar('💎')">💎</div>
                            <div class="avatar-option" onclick="selectAvatar('💀')">💀</div>
                        </div>
                    </div>
                    <button class="btn-action" onclick="saveProfile()" style="margin-top: 5px;">Сохранить изменения</button>
                </div>
            </div>
        </div>

        <!-- Управление кланами (База) -->
        <div id="section-clans-hub" class="section-view" style="display: none;">
            <div class="card-box">
                <h3>🏰 Список кланов</h3>
                <div class="clan-list" id="clans-list"></div>
            </div>
        </div>

        <!-- Клан (Вкладка активного клана) -->
        <div id="section-clan" class="section-view" style="display: none;">
            <div class="card-box" id="my-clan-control-panel">
                <!-- Заполняется динамически -->
            </div>
        </div>

        <!-- Магазин подарков -->
        <div id="section-gifts" class="section-view" style="display: none;">
            <div style="margin-bottom: 4px;">
                <h3 style="color: #818cf8; font-size: 1.1rem; margin-bottom: 4px;">🎁 Магазин подарков</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Дарите подарки прямо в чат!</p>
            </div>
            <div class="gift-grid" id="gift-store-grid"></div>
        </div>

    </div>

    <!-- Нижнее меню -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-world" onclick="switchTab('world')">
            <span class="icon">💬</span>
            <span>Мир</span>
        </button>
        <button class="nav-item" id="nav-clan" onclick="switchTab('clan')">
            <span class="icon">🛡️</span>
            <span>Клан</span>
        </button>
        <button class="nav-item" id="nav-clans-hub" onclick="switchTab('clans-hub')">
            <span class="icon">🏰</span>
            <span>База</span>
        </button>
        <button class="nav-item" id="nav-gifts" onclick="switchTab('gifts')">
            <span class="icon">🎁</span>
            <span>Подарки</span>
        </button>
    </nav>

    <script>
        let state = {
            username: "Игрок_" + Math.floor(Math.random() * 900 + 100),
            avatar: "👑",
            status: "Люблю общаться в МирЧате!",
            coins: 1500,
            clanId: null,
            activeTab: 'world'
        };

        const giftStore = [
            { id: 1, name: "🌟 Звезда", price: 100, icon: "🌟", desc: "Знак внимания" },
            { id: 2, name: "🏆 Кубок", price: 300, icon: "🏆", desc: "Символ успеха" },
            { id: 3, name: "👑 Корона", price: 750, icon: "👑", desc: "Для лидера" },
            { id: 4, name: "🚀 Ракета", price: 1500, icon: "🚀", desc: "Эпический буст" }
        ];

        let clans = [
            { id: 1, name: "Cyber Dragons", tag: "DRGN", treasury: 2500, level: 2, members: 3, leader: "Система" },
            { id: 2, name: "Phoenix Legion", tag: "PHNX", treasury: 1200, level: 1, members: 1, leader: "Система" }
        ];

        let messages = [
            { id: 1, type: 'world', sender: "Система", text: "Добро пожаловать! Нажмите на свой профиль вверху слева, чтобы настроить аватарку и имя.", time: "12:00", badge: "ADMIN" }
        ];

        window.onload = function() {
            updateUI();
            renderMessages();
            renderGiftStore();
            renderClansList();
            renderClanTab();
        };

        function updateUI() {
            document.getElementById('header-name').innerText = state.username;
            document.getElementById('header-avatar').innerText = state.avatar;
            document.getElementById('my-coins').innerText = state.coins;
            
            document.getElementById('profile-big-avatar').innerText = state.avatar;
            document.getElementById('profile-display-name').innerText = state.username;
            document.getElementById('profile-status-text').innerText = state.status;
            document.getElementById('profile-coins').innerText = state.coins;

            document.getElementById('input-edit-name').value = state.username;
            document.getElementById('input-edit-status').value = state.status;
        }

        function switchTab(tabName) {
            state.activeTab = tabName;
            
            document.getElementById('section-chat').style.display = 'none';
            document.getElementById('section-profile').style.display = 'none';
            document.getElementById('section-clans-hub').style.display = 'none';
            document.getElementById('section-clan').style.display = 'none';
            document.getElementById('section-gifts').style.display = 'none';

            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('nav-' + tabName);
            if (activeBtn) activeBtn.classList.add('active');

            const titles = {
                'world': 'Всемирный чат',
                'profile': 'Мой профиль',
                'clan': 'Мой клан',
                'clans-hub': 'База кланов',
                'gifts': 'Магазин подарков'
            };
            document.getElementById('current-section-title').innerText = titles[tabName] || 'МирЧат';

            if (tabName === 'world') {
                document.getElementById('section-chat').style.display = 'flex';
                renderMessages();
            } else if (tabName === 'profile') {
                document.getElementById('section-profile').style.display = 'flex';
            } else if (tabName === 'clans-hub') {
                document.getElementById('section-clans-hub').style.display = 'flex';
                renderClansList();
            } else if (tabName === 'clan') {
                document.getElementById('section-clan').style.display = 'flex';
                renderClanTab();
            } else if (tabName === 'gifts') {
                document.getElementById('section-gifts').style.display = 'flex';
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messages.push({
                id: Date.now(),
                type: 'world',
                sender: state.avatar + " " + state.username,
                text: text,
                time: timeNow,
                badge: state.clanId ? getClanTag(state.clanId) : ''
            });

            state.coins += 5;
            updateUI();
            input.value = '';
            renderMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function renderMessages() {
            const list = document.getElementById('messages-list');
            list.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message-card';
                div.innerHTML = `
                    <div class="message-header">
                        <div class="sender-info">
                            ${msg.badge ? `<span class="clan-badge">${msg.badge}</span>` : ''}
                            <span class="sender-name">${msg.sender}</span>
                        </div>
                        <span class="message-time">${msg.time}</span>
                    </div>
                    <div class="message-text">${msg.text}</div>
                `;
                list.appendChild(div);
            });
            list.scrollTop = list.scrollHeight;
        }

        function renderGiftStore() {
            const grid = document.getElementById('gift-store-grid');
            grid.innerHTML = '';
            giftStore.forEach(gift => {
                const card = document.createElement('div');
                card.className = 'gift-item';
                card.innerHTML = `
                    <div>
                        <div class="gift-icon">${gift.icon}</div>
                        <h4 style="font-size: 0.95rem; margin-bottom: 2px;">${gift.name}</h4>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">${gift.desc}</p>
                    </div>
                    <div>
                        <div class="gift-price">${gift.price} 🪙</div>
                        <button class="btn-action" style="padding: 6px; font-size: 0.8rem;" onclick="buyGift(${gift.id})">Отправить</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function buyGift(giftId) {
            const gift = giftStore.find(g => g.id === giftId);
            if (state.coins < gift.price) {
                alert('Недостаточно монет!');
                return;
            }
            state.coins -= gift.price;
            updateUI();

            messages.push({
                id: Date.now(),
                type: 'world',
                sender: "🎁 Подарок",
                text: `<b>${state.username}</b> отправил в чат подарок ${gift.icon} <b>${gift.name}</b>!`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                badge: state.clanId ? getClanTag(state.clanId) : ''
            });

            switchTab('world');
            alert(`Подарок ${gift.name} отправлен!`);
        }

        function getClanTag(id) {
            const clan = clans.find(c => c.id === id);
            return clan ? clan.tag : '';
        }

        function renderClansList() {
            const list = document.getElementById('clans-list');
            list.innerHTML = '';
            
            // Кнопка создания клана всегда сверху в базе
            const createDiv = document.createElement('div');
            createDiv.style.cssText = "margin-bottom: 12px;";
            createDiv.innerHTML = `<button class="btn-action" onclick="showCreateClanModal()">➕ Создать свой клан (500 🪙)</button>`;
            list.appendChild(createDiv);

            clans.forEach(clan => {
                const isMyClan = state.clanId === clan.id;
                const div = document.createElement('div');
                div.className = 'clan-card';
                div.innerHTML = `
                    <div>
                        <h4 style="color: #818cf8; font-size: 0.95rem;">[${clan.tag}] ${clan.name}</h4>
                        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Казна: ${clan.treasury} 🪙 | Ур. ${clan.level} | Участников: ${clan.members}</p>
                    </div>
                    ${isMyClan ? '<span style="color: var(--success-color); font-weight: bold; font-size: 0.85rem;">Ваш</span>' : `<button class="btn-action" style="padding: 5px 10px; font-size: 0.75rem; width: auto;" onclick="joinClan(${clan.id})">Вступить</button>`}
                `;
                list.appendChild(div);
            });
        }

        function renderClanTab() {
            const panel = document.getElementById('my-clan-control-panel');
            if (!state.clanId) {
                panel.innerHTML = `
                    <h3 style="color: #818cf8;">🛡️ Управление кланом</h3>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin: 10px 0 15px 0;">Вы пока не состоите в клане. Перейдите в базу кланов, чтобы вступить или создать свой.</p>
                    <button class="btn-action" onclick="switchTab('clans-hub')">Перейти к базе кланов</button>
                `;
                return;
            }

            const clan = clans.find(c => c.id === state.clanId);
            panel.innerHTML = `
                <h3 style="color: #818cf8; font-size: 1.15rem; margin-bottom: 6px;">[${clan.tag}] ${clan.name}</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Уровень клана: <b>${clan.level}</b> | Участников: <b>${clan.members}</b></p>
                
                <div style="background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.2); padding: 12px; border-radius: 12px; margin-bottom: 15px;">
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Общая казна клана:</div>
                    <div style="font-size: 1.3rem; font-weight: bold; color: var(--gold-color); margin-top: 2px;">${clan.treasury} 🪙</div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn-action" onclick="donateToClan(100)">💰 Внести 100 монет в казну</button>
                    <button class="btn-action" onclick="editClanSettings()">✏️ Изменить данные клана</button>
                    <button class="btn-action btn-danger" onclick="leaveClan()">🚪 Покинуть клан</button>
                </div>
            `;
        }

        function showCreateClanModal() {
            const name = prompt("Введите название нового клана:");
            if (!name) return;
            const tag = prompt("Введите тег клана (до 4 символов):", "TEAM").toUpperCase();
            if (!tag) return;

            if (state.coins < 500) {
                alert('Для создания клана нужно 500 монет!');
                return;
            }

            state.coins -= 500;
            updateUI();

            const newClan = {
                id: Date.now(),
                name: name,
                tag: tag.substring(0, 4),
                treasury: 100,
                level: 1,
                members: 1,
                leader: state.username
            };
            clans.push(newClan);
            state.clanId = newClan.id;
            
            renderClansList();
            renderClanTab();
            alert('Клан успешно создан! Теперь вам доступна вкладка «Клан».');
            switchTab('clan');
        }

        function joinClan(clanId) {
            state.clanId = clanId;
            const clan = clans.find(c => c.id === clanId);
            if (clan) clan.members++;

            renderClansList();
            renderClanTab();
            alert(`Вы успешно вступили в клан [${clan.tag}]!`);
            switchTab('clan');
        }

        function leaveClan() {
            const clan = clans.find(c => c.id === state.clanId);
            if (clan) clan.members = Math.max(1, clan.members - 1);
            state.clanId = null;
            
            renderClansList();
            renderClanTab();
            alert('Вы вышли из клана.');
            switchTab('clans-hub');
        }

        function donateToClan(amount) {
            if (state.coins < amount) {
                alert('У вас недостаточно монет!');
                return;
            }
            state.coins -= amount;
            updateUI();

            const clan = clans.find(c => c.id === state.clanId);
            if (clan) {
                clan.treasury += amount;
                if (clan.treasury >= clan.level * 2000) {
                    clan.level++;
                    alert(`🎉 Поздравляем! Ваш клан повысил уровень до ${clan.level}!`);
                }
            }

            renderClanTab();
            renderClansList();
            alert(`Вы пополнили казну клана на ${amount} 🪙!`);
        }

        function editClanSettings() {
            const clan = clans.find(c => c.id === state.clanId);
            if (!clan) return;

            const newName = prompt("Новое название клана:", clan.name);
            if (newName) clan.name = newName;

            const newTag = prompt("Новый тег клана (до 4 символов):", clan.tag);
            if (newTag) clan.tag = newTag.toUpperCase().substring(0, 4);

            renderClanTab();
            renderClansList();
            alert('Настройки клана обновлены!');
        }
    </script>
</body>
</html>
